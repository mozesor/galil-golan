<link rel="apple-touch-icon" href="icons/crest-180.png?v=4" />

<link rel="icon" type="image/png" sizes="192x192" href="icons/crest-192.png?v=4" />

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   חולצת הבית בכחול לבן: צעיף, מספר גב, גיר, כרטיס, לוח LED
   ========================================================= */
:root{
  --bg:#EEF2F8; --surface:#FAFBFE; --ink:#0F1B2D; --muted:#55627A;
  --accent:#1E56C8; --accent-ink:#FAFBFE; --club:#1E56C8;
  --win:#1E8E4F; --draw:#6F7A8E; --loss:#C62828;
  --line:rgba(15,27,45,.12); --line-strong:rgba(15,27,45,.3); --chalk:rgba(15,27,45,.45);
  --led:#0B1220; --scarf-bg:#FAFBFE; --scarf-ink:#0F1B2D;
  --shadow-hard:-3px 3px 0 var(--ink);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1); --ease-slam:cubic-bezier(.2,.8,.2,1);
  --display:"Karantina","Noto Sans Hebrew",sans-serif;
  --body:"Rubik","Noto Sans Hebrew",system-ui,sans-serif;
  --nav-h:62px; --top:calc(52px + env(safe-area-inset-top));
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#141E30; --ink:#F3F6FB; --muted:#A3AFC4;
  --accent:#5B9BFF; --accent-ink:#0B1220;
  --win:#3CCB7F; --draw:#8E99AE; --loss:#E8453C;
  --line:rgba(243,246,251,.12); --line-strong:rgba(243,246,251,.3); --chalk:rgba(243,246,251,.45);
  --scarf-bg:#141E30; --scarf-ink:#F3F6FB;
  --shadow-hard:-3px 3px 0 var(--accent);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#141E30; --ink:#F3F6FB; --muted:#A3AFC4;
    --accent:#5B9BFF; --accent-ink:#0B1220;
    --win:#3CCB7F; --draw:#8E99AE; --loss:#E8453C;
    --line:rgba(243,246,251,.12); --line-strong:rgba(243,246,251,.3); --chalk:rgba(243,246,251,.45);
    --scarf-bg:#141E30; --scarf-ink:#F3F6FB;
    --shadow-hard:-3px 3px 0 var(--accent);
    color-scheme:dark;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  overscroll-behavior-y:contain;font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
button,a.btn,.tk,.led,.tbl tr,.nav button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
h1,h2,h3{margin:0;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate}
.iso{unicode-bidi:isolate}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:focus:not(:focus-visible){outline:0}
.press{transition:transform 140ms var(--ease-out)}
.press:active{transform:scale(.97)}
::view-transition-old(root),::view-transition-new(root){animation-duration:220ms}

/* ---------- scarf ---------- */
.scarf{
  position:sticky;top:0;z-index:20;height:var(--top);padding-top:env(safe-area-inset-top);
  display:grid;grid-template-columns:1fr 1fr;align-items:stretch;
  background:var(--scarf-bg);border-bottom:2px solid var(--club);
}
.scarf::before{content:"";position:absolute;top:0;inset-inline:0;height:env(safe-area-inset-top,0px);background:var(--club);z-index:2}
.scarf .a{
  background:var(--club);color:#FAFBFE;
  clip-path:polygon(0 0,100% 0,100% 100%,18px 100%);
  display:flex;align-items:center;padding-inline:16px 30px;
}
.scarf .b{color:var(--scarf-ink);display:flex;align-items:center;justify-content:space-between;padding-inline:8px 12px}
.scarf .name{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.scarf .cat{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;white-space:nowrap}
.scarf.enter{animation:scarfIn 380ms var(--ease-slam) both}
@keyframes scarfIn{from{transform:translateY(-100%)}to{transform:none}}
.themeBtn{width:44px;height:40px;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent)}
.themeBtn svg{grid-area:1/1;width:20px;height:20px;transition:opacity 200ms ease,transform 260ms var(--ease-out)}
.themeBtn .sun{opacity:0;transform:rotate(-90deg) scale(.7)}
:root[data-theme="dark"] .themeBtn .sun{opacity:1;transform:none}
:root[data-theme="dark"] .themeBtn .moon{opacity:0;transform:rotate(90deg) scale(.7)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .themeBtn .sun{opacity:1;transform:none}
  :root:not([data-theme="light"]) .themeBtn .moon{opacity:0;transform:rotate(90deg) scale(.7)}
}

/* ---------- pull to refresh ---------- */
.ptr{position:fixed;top:calc(var(--top) + 10px);inset-inline:0;z-index:15;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-56px)}
.ptr .stamp{background:var(--bg)}

/* ---------- layout ---------- */
.app{max-width:640px;margin:0 auto;padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
.pad{padding-inline:16px}
.view{display:none}
.view.on{display:block;animation:viewFade 140ms var(--ease-out) both}
@keyframes viewFade{from{opacity:0}to{opacity:1}}
.view.first .rise{animation:rise 300ms var(--ease-out) both;animation-delay:calc(min(var(--i,0),4) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:28px 0 12px}
.h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:10px;vertical-align:middle}

/* ---------- stamp ---------- */
.stamp{
  --c:var(--ink);
  display:inline-block;transform:rotate(-8deg);font-family:var(--display);font-weight:700;font-size:24px;line-height:1;
  padding:5px 10px 3px;border:2px solid var(--c);color:var(--c);
  box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c);white-space:nowrap;
}
.stamp.big{font-size:28px;padding:5px 10px 3px;margin-inline-end:8px}
.stamp.sm{font-size:22px}
.stamp.accent{--c:var(--accent)}
.stamp.muted{--c:var(--muted)}
.stamp.win{--c:var(--win)}.stamp.draw{--c:var(--draw)}.stamp.loss{--c:var(--loss)}
.stamp.slam{animation:slam 280ms var(--ease-slam) both}
@keyframes slam{from{opacity:0;transform:rotate(-8deg) scale(1.6)}to{opacity:1;transform:rotate(-8deg) scale(1)}}

/* ---------- jersey mark ---------- */
.mark{
  flex:none;display:grid;place-items:center;border:2px solid currentColor;
  font-family:var(--display);font-weight:700;line-height:1;
  width:var(--s,44px);height:var(--s,44px);font-size:calc(var(--s,44px) * .52);
}
.mark.me{background:var(--club);color:#FAFBFE;border-color:var(--club)}
.mark.rank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mark.rank b{font-family:var(--display);font-weight:700;font-size:calc(var(--s,44px) * .62);line-height:.85}
.mark.rank small{font-family:var(--body);font-weight:600;font-size:13px;line-height:1;color:var(--muted)}
.mark.rank.me small{color:inherit;opacity:.85}
.mark.rank small.na{font-size:14px;text-align:center;line-height:1.2}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);padding:48px 16px 0}
.hero::before{ /* jersey collar */
  content:"";position:absolute;top:0;left:0;right:0;height:28px;
  background:repeating-linear-gradient(135deg,var(--club) 0 22px,transparent 22px 44px);pointer-events:none;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.eyebrow{font-weight:600;font-size:13px;color:var(--muted)}
.eyebrow b{display:inline-block;background:var(--club);color:#FAFBFE;padding:2px 8px;font-weight:600;margin-inline-end:6px}
.opp{display:flex;align-items:center;gap:14px;margin-top:16px}
.opp .mark{--s:96px;border-width:3px}
.opp .who{min-width:0;flex:1}
.opp .pre{font-size:14px;font-weight:500;color:var(--muted)}
.fit{word-break:keep-all;overflow-wrap:normal;hyphens:none;text-wrap:balance;unicode-bidi:isolate}
.opp .name{font-family:var(--display);font-weight:700;font-size:56px;line-height:.92}
.chalk{height:0;border-top:2px dashed var(--chalk);margin:18px 0 14px}
.details{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}
.details .when{font-weight:500;font-size:16px;line-height:1.3}
.est{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);border:2px dashed var(--line-strong);padding:0 6px;margin-inline-start:4px;white-space:nowrap;vertical-align:middle}
.details .where{font-size:14px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.details .where svg{width:15px;height:15px;flex:none}
.details .time{font-family:var(--display);font-weight:700;font-size:44px;line-height:.9;color:var(--accent)}
.cd{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 0;min-height:132px;align-content:center;direction:ltr}
.cd .lab,.cd .today{direction:rtl}
.cd.two{grid-template-columns:1fr 1fr}
.cd.single{grid-template-columns:1fr}
.cd .cell{text-align:center;padding:8px 0 10px;border-left:2px dashed var(--chalk)}
.cd .cell:first-of-type{border-left:0}
.cd .digits{font-family:var(--display);font-weight:700;font-size:104px;line-height:.86;display:inline-flex;direction:ltr}
.cd.single .digits{font-size:120px}
.cd .d{display:inline-block;min-width:.5em;text-align:center}
.cd .lab{font-weight:600;font-size:13px;color:var(--muted);margin-top:2px}
.cd .lab.c{text-align:center;grid-column:1/-1}
.cd .today{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:48px;line-height:1;text-align:center;padding:10px 0 6px}
.cd .today:empty{display:none}
.tear{height:16px;margin:14px -16px 0;background:radial-gradient(circle at 7px 8px,var(--surface) 6px,transparent 7px) 0 0/14px 16px repeat-x}
.actions{display:grid;grid-template-columns:1fr 56px 56px;gap:10px;padding:14px 16px 20px;background:var(--surface);border-bottom:2px solid var(--ink)}
.btn{
  height:56px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:16px;border:2px solid var(--ink);color:var(--ink);background:transparent;white-space:nowrap;overflow:hidden;
}
.btn svg{width:22px;height:22px;flex:none}
.btn.accent{background:var(--club);color:#FAFBFE;border-color:var(--club)}
.btn.sq{padding:0}
.btn.ok{border-color:var(--win);color:var(--win)}
.btn.accent.ok{background:var(--win);border-color:var(--win);color:#FAFBFE}
.note{margin:12px 0 0;padding:10px 12px;border-inline-start:4px solid var(--club);background:var(--surface);font-size:15px;line-height:1.45}

/* ---------- LED ---------- */
.led{background:var(--led);color:#F3F6FB;position:relative;overflow:hidden;padding:58px 16px 14px;cursor:pointer}
.led::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.led > *{position:relative}
.led .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.led .t{font-family:var(--display);font-weight:700;font-size:26px;line-height:.95;text-align:center}
.led .t.me{color:#8CB6FF}
.sc{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.sc i{font-style:normal;opacity:.5;margin:0 .12em}
.led .sc{font-family:var(--display);font-weight:700;font-size:68px;line-height:1;color:#F3F6FB;overflow:hidden;padding:0 2px}
.led .sc .n{display:inline-block}
.led .sc.W{color:#3CCB7F}.led .sc.L{color:#E8453C}.led .sc.D{color:#A3AFC4}
.led .meta{text-align:center;font-size:13px;color:#A3AFC4;margin-top:8px}
.led .stampWrap{position:absolute;top:14px;inset-inline:0;display:flex;justify-content:center}
.led .stamp{box-shadow:0 0 0 3px var(--led),0 0 0 5px var(--c)}
.led .stamp.win{--c:#3CCB7F}.led .stamp.loss{--c:#E8453C}.led .stamp.draw{--c:#A3AFC4}
.led.reveal .sc .n{opacity:0;transform:translateY(-40%);transition:transform 260ms var(--ease-out),opacity 200ms var(--ease-out)}
.led.reveal .sc .n:last-child{transition-delay:90ms}
.led.reveal .stamp{opacity:0;transform:rotate(-8deg) scale(1.5);transition:transform 260ms var(--ease-slam) 380ms,opacity 160ms ease 380ms}
.led.reveal.in .sc .n{opacity:1;transform:none}
.led.reveal.in .stamp{opacity:1;transform:rotate(-8deg)}

/* ---------- form chevrons (newest on the left, pointing forward) ---------- */
.form{display:inline-flex;gap:2px}
.chev{
  position:relative;width:34px;height:26px;display:grid;place-items:center;color:#FAFBFE;
  font-family:var(--display);font-weight:700;font-size:20px;line-height:1;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 50%,100% 100%,8px 100%,0 50%);
}
.chev.W{background:var(--win)}.chev.D{background:var(--draw)}.chev.L{background:var(--loss)}
.chev.E{background:var(--line-strong)}
.chev.E::before{content:"";position:absolute;inset:2px;background:var(--surface);clip-path:inherit}
.view.first .formRow .chev{transform-origin:right center;animation:chevIn 240ms var(--ease-slam) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
@keyframes chevIn{from{transform:scaleX(.6);opacity:0}to{transform:none;opacity:1}}

/* ---------- season tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);background:var(--surface)}
.tile{padding:12px 6px 10px;text-align:center;border-inline-start:2px dashed var(--line-strong)}
.tile:first-child{border-inline-start:0}
.tile b{display:block;font-family:var(--display);font-weight:700;font-size:42px;line-height:.9}
.tile b.W{color:var(--win)}.tile b.L{color:var(--loss)}
.tile b.na{font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted);line-height:38px}
.tile span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.cupRow{text-align:start;color:var(--ink)}
.cupRow .cupSt{font-weight:500;color:var(--accent);white-space:normal;text-align:end}
.formRow{display:flex;justify-content:space-between;align-items:center;gap:10px;white-space:nowrap;padding:12px 14px;border:2px solid var(--ink);border-top:0;background:var(--surface);font-weight:600;font-size:15px}

/* ---------- ticket ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.tk{
  display:grid;grid-template-columns:62px 1fr 84px;align-items:stretch;
  background:var(--surface);border:2px solid var(--ink);text-align:start;width:100%;position:relative;color:var(--ink);
}
.tk.next{box-shadow:var(--shadow-hard)}
.tk .dt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-inline-end:2px dashed var(--line-strong)}
.tk .dt b{font-family:var(--display);font-weight:700;font-size:38px;line-height:.9}
.tk .dt span{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;text-align:center;line-height:1.25}
.tk .mid{padding:10px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tk .ln{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.tk .n{font-weight:600;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:isolate}
.tk .n.me{color:var(--accent)}
.tk .g{font-family:var(--display);font-weight:700;font-size:28px;line-height:.95;min-width:18px;text-align:center}
.tk .g.lo{color:var(--muted)}
.tk .m{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tk .tag{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;border:2px solid currentColor;line-height:1.5}
.tk .tag.home{color:var(--accent)}
.tk .tag.cup{color:#FAFBFE;background:var(--club);border-color:var(--club)}
.tk .stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-inline-start:2px dashed var(--line-strong);padding:6px 4px;position:relative}
.tk .stub::before,.tk .stub::after{content:"";position:absolute;inset-inline-start:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tk .stub::before{top:-10px;clip-path:inset(50% 0 0 0)}
.tk .stub::after{bottom:-10px;clip-path:inset(0 0 50% 0)}
.tk .res{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.tk .res.W{color:var(--win)}.tk .res.L{color:var(--loss)}.tk .res.D{color:var(--draw)}
.tk .tm{font-family:var(--display);font-weight:700;font-size:32px;line-height:1}
.tk .tbd{font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.25}
.tk .r{font-size:12px;color:var(--muted);font-weight:600}
.tk.install{grid-template-columns:62px 1fr auto;cursor:default}
.tk.install .dt b{font-size:44px}
.tk.install .stub{padding:8px 10px;gap:6px}
.tk.install .btn{height:40px;font-size:14px;padding:0 12px}
.linkBtn{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;min-height:32px}
.month{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
.month small{font-weight:400;font-size:28px;color:var(--muted)}
.month:first-child{margin-top:4px}
.emptyMonth{font-size:15px;color:var(--muted);padding:8px 2px 4px}

/* segmented + rounds */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);position:relative;margin:16px 0 12px;background:var(--surface)}
.seg button{position:relative;z-index:1;height:44px;font-weight:600;font-size:15px;color:var(--muted);transition:color 160ms ease}
.seg button[aria-selected="true"]{color:#FAFBFE}
.seg .thumb{position:absolute;top:0;bottom:0;inset-inline-start:0;width:calc(100% / 3);background:var(--club);transition:transform 240ms var(--ease-out)}
.seg[data-i="1"] .thumb{transform:translateX(-100%)}
.seg[data-i="2"] .thumb{transform:translateX(-200%)}
.cupHead{border:2px solid var(--ink);background:var(--surface);padding:14px;margin-bottom:12px}
.cupHead b{display:block;font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.cupHead span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.rounds{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scroll-snap-type:x proximity;scrollbar-width:none}
.rounds[hidden]{display:none}
.rounds::-webkit-scrollbar{display:none}
.rounds button{flex:none;height:44px;padding:0 14px;border:2px solid var(--line-strong);font-weight:600;font-size:14px;color:var(--muted);scroll-snap-align:center;background:var(--surface)}
.rounds button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:8px 4px;border-bottom:2px solid var(--ink);position:sticky;top:var(--top);background:var(--bg);z-index:2}
.tbl th.l{text-align:start}
.tbl td{padding:0 4px;height:52px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:nth-child(4n) td{border-bottom:2px solid var(--line-strong)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.rk{width:40px}
.tbl .rkw{display:flex;flex-direction:column;align-items:center;gap:2px}
.tbl .rkw span{font-family:var(--display);font-weight:400;font-size:26px;line-height:.9;color:var(--muted)}
.tbl .mv{width:8px;height:6px}
.tbl .mv.up{color:var(--win)}.tbl .mv.down{color:var(--loss);transform:rotate(180deg)}
.tbl td.l{text-align:start;font-weight:500;max-width:0;width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td.l .mark{--s:30px;display:inline-grid;vertical-align:middle;margin-inline-end:8px;font-size:15px}
.tbl td.pt{font-family:var(--display);font-weight:700;font-size:30px;width:44px}
.tbl td.gd{color:var(--muted);font-size:14px}
.tbl tr{cursor:pointer}
.tbl tr:active td{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tbl tr.me td{background:color-mix(in srgb,var(--club) 16%,transparent)}
.tbl tr.me td.rk{box-shadow:inset -6px 0 0 var(--club)}
.tbl tr.me .rkw span{color:var(--ink);font-weight:700}
.tbl tr.me td.l{font-weight:600}
.tblNote{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.5}

/* ---------- ticker ---------- */
.ticker{display:grid;grid-template-columns:auto 1fr;align-items:center;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--surface);margin-top:28px;overflow:hidden;height:48px}
.ticker .lab{background:var(--club);color:#FAFBFE;font-weight:600;font-size:13px;height:100%;display:flex;align-items:center;padding:0 10px;white-space:nowrap}
.ticker .track{overflow:hidden;height:100%}
.ticker .run{display:flex;gap:28px;align-items:center;height:100%;width:max-content;padding-inline:14px;animation:runRtl var(--dur,30s) linear infinite;animation-play-state:paused}
.ticker.play .run{animation-play-state:running}
.ticker:active .run{animation-play-state:paused}
@keyframes runRtl{from{transform:translateX(0)}to{transform:translateX(50%)}}
.ticker .it{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;color:var(--muted)}
.ticker .it > span{unicode-bidi:isolate}
.ticker .it b{font-family:var(--display);font-weight:700;font-size:24px;color:var(--ink)}
.ticker .it.me{color:var(--ink);box-shadow:inset 0 -2px 0 var(--club)}
.ticker.static .track{overflow-x:auto;scrollbar-width:none}
.ticker.static .run{animation:none}

/* ---------- nav ---------- */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:#0F1B2D;color:#F3F6FB;border-top:2px solid var(--club);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:rgba(243,246,251,.62);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:#F3F6FB}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;inset-inline:18%;height:4px;background:#5B9BFF}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(11,18,32,.6);opacity:0;pointer-events:none;transition:opacity 260ms ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;
  max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--bg);color:var(--ink);border-top:4px solid var(--club);
  padding:0 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform 240ms var(--ease-drawer);
}
.sheet.on{transform:none;transition-duration:420ms}
.grab{height:36px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:"";width:48px;height:4px;background:var(--line-strong)}
.sheet-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet-h .mark{--s:72px;border-width:3px}
.sheet-h > div{min-width:0;flex:1}
.sheet-h h3{font-family:var(--display);font-weight:700;font-size:38px;line-height:.92}
.sheet-h .sub{font-size:14px;color:var(--muted);margin-top:4px;font-weight:500}
.sheet .h3{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;margin:22px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.sheet .emptyLine{font-size:15px;color:var(--muted);padding:4px 2px}

/* ---------- states ---------- */
.sk{position:relative;overflow:hidden;background:var(--surface);border:2px solid var(--line)}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 7%,transparent),transparent);transform:translateX(100%);animation:skRun 1.2s linear infinite}
@keyframes skRun{to{transform:translateX(-100%)}}
.empty{padding:24px 16px;border:2px dashed var(--line-strong);color:var(--muted);font-size:15px;text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-weight:700;font-size:30px;margin-bottom:4px}
.err{margin:16px;padding:14px;border:2px solid var(--loss);color:var(--loss);font-weight:600;font-size:15px}
.updated{font-size:13px;color:var(--muted);text-align:center;margin:26px 16px 0}
.updated a{text-decoration:underline}
.stale .updated{color:var(--loss);font-weight:600}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:8px 16px 0;opacity:.85}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
.calTop{display:grid;grid-template-columns:1fr 56px;gap:10px;margin:16px 0 4px}
.calHint{font-size:13px;color:var(--muted);margin:0 0 6px}

@media (min-width:900px){ .app{max-width:720px} }
@media (prefers-reduced-motion: reduce){
  .view.on,.view.first .rise,.view.first .formRow .chev,.stamp.slam,.scarf.enter{animation:fade 200ms ease both}
  .led.reveal .sc .n,.led.reveal .stamp{transform:none!important;transition:opacity 200ms ease}
  .sheet,.sheet.on{transition:transform 1ms}
  .sk::after,.ticker .run{animation:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<header class="scarf" id="scarf">
  <div class="a"><span class="name" id="teamTitle">גליל גולן דרום</span></div>
  <div class="b"><span class="cat">ילדים ב׳</span>
    <button class="themeBtn press" id="themeBtn" aria-label="מצב יום או לילה">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
  </div>
</header>
<div class="ptr" id="ptr" aria-hidden="true"><span class="stamp accent">משכו לרענון</span></div>

<div class="app">
  <main id="main">
    <section class="view on" id="v-home" aria-label="בית">
      <div id="homeBody">
        <div class="sk" style="height:430px;border-inline:0"></div>
        <div class="pad"><div class="sk" style="height:130px;margin-top:16px"></div></div>
      </div>
    </section>

    <section class="view pad" id="v-games" aria-label="משחקים">
      <div class="seg" id="gamesSeg" data-i="0"><div class="thumb"></div>
        <button aria-selected="true" data-i="0">המשחקים שלנו</button>
        <button aria-selected="false" data-i="1">כל הליגה</button>
        <button aria-selected="false" data-i="2">גביע</button>
      </div>
      <div id="roundsBar" class="rounds" hidden></div>
      <div id="gamesBody" class="list"></div>
    </section>

    <section class="view pad" id="v-table" aria-label="טבלה">
      <h2 class="h2">טבלת הליגה<small id="tblSub"></small></h2>
      <table class="tbl" id="tbl">
        <thead><tr><th>מק׳</th><th class="l">קבוצה</th><th>מש׳</th><th>הפרש</th><th>נק׳</th></tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
      <div class="tblNote" id="tblNote"></div>
    </section>

    <section class="view pad" id="v-cal" aria-label="יומן">
      <div class="calTop">
        <a class="btn accent press" id="subscribe" href="season.ics" data-flash="נפתח">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg><span>חיבור ליומן הטלפון</span></a>
        <button class="btn sq press" id="shareSeason" aria-label="שיתוף הלוח"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8h16v-8M16 6l-4-4-4 4M12 2v13"/></svg></button>
      </div>
      <p class="calHint">מתחברים פעם אחת, והיומן מתעדכן לבד כשמתפרסמות שעות או מגרש.</p>
      <div id="calBody"></div>

    <div class="updated" id="updated"></div>

  </main>
</div>

<nav class="nav" aria-label="ניווט">
  <div class="nav-in">
    <button class="press" data-view="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>בית</button>
    <button class="press" data-view="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4.5 3.3-1.7 5.4H9.2L7.5 10.3z"/><path d="M12 3v4M7.5 10.3L4 9M16.5 10.3L20 9M9.2 15.7L7 19M14.8 15.7L17 19"/></svg>משחקים</button>
    <button class="press" data-view="table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>טבלה</button>
    <button class="press" data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>יומן</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="פרטים" tabindex="-1"><div class="grab" aria-hidden="true"></div><div id="sheetBody"></div></div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const root=document.documentElement;
const TZ="Asia/Jerusalem";
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const LS={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const SS={get(k){try{return sessionStorage.getItem(k)}catch{return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch{}}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let DATA=null,CFG=null,OVR=null,ME=null,NEXT=null,lastFetch=0,installEvt=null,CUP=[];
const state={view:"home",gamesMode:0,round:null};
const seen=new Set(), scrollPos={};

/* ---------- theme ---------- */
function applyTheme(t){ if(t) root.dataset.theme=t; else delete root.dataset.theme; }
applyTheme(LS.get("gd-theme")||"");
$("#themeBtn").addEventListener("click",()=>{
  const next=getComputedStyle(root).colorScheme.includes("dark")?"light":"dark";
  const go=()=>applyTheme(next);
  if(document.startViewTransition&&!REDUCED) document.startViewTransition(go); else go();
  LS.set("gd-theme",next);
});
if(!SS.get("gd-scarf")){ $("#scarf").classList.add("enter"); SS.set("gd-scarf","1"); }
document.addEventListener("touchstart",()=>{},{passive:true}); // enables :active on iOS

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const heb=s=>String(s??"").replace(/'/g,"׳").replace(/"/g,"״");
const parts=d=>{ const f=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); const o={}; for(const p of f.formatToParts(d)) o[p.type]=p.value; if(o.hour==="24") o.hour="00"; return o; };
const isoOf=d=>{ const p=parts(d); return `${p.year}-${p.month}-${p.day}`; };
const todayIso=()=>isoOf(new Date());
function israelDate(iso,h,m){
  const guess=new Date(`${iso}T${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:00Z`);
  if(isNaN(guess)) return null;
  const p=parts(guess); const wall=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);
  return new Date(guess.getTime()-(wall-guess.getTime()));
}
const validTime=s=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(s||""); return m&&+m[1]<24&&+m[2]<60?[+m[1],+m[2]]:null; };
// Sources, strongest first: admin override, ONE kickoff time, IFA kickoff time. A game with none of them
// has only the round's planned date ("est"), which can still move to a nearby day.
function gameTime(g){
  const d=new Date(g.date); const p=parts(d); const oneIso=`${p.year}-${p.month}-${p.day}`;
  const iso=/^\d{4}-\d{2}-\d{2}$/.test(g.ifa?.date||"")?g.ifa.date:oneIso;
  const mk=(t,src)=>{ const dt=israelDate(iso,t[0],t[1]); return dt?{date:dt,tbd:false,est:false,timeStr:`${String(t[0]).padStart(2,"0")}:${String(t[1]).padStart(2,"0")}`,iso,src}:null; };
  const ov=validTime(OVR?.games?.[g.id]?.time); if(ov){ const r=mk(ov,"admin"); if(r) return r; }
  const oneTbd=(p.hour==="00"||p.hour==="01")&&p.minute==="00";
  if(!oneTbd) return {date:d,tbd:false,est:false,timeStr:`${p.hour}:${p.minute}`,iso:oneIso,src:"one"};
  const it=validTime(g.ifa?.time); if(it){ const r=mk(it,"ifa"); if(r) return r; }
  return {date:israelDate(iso,12,0)||d,tbd:true,est:true,timeStr:"",iso,src:"none"};
}
function expiresAt(g){ const t=gameTime(g); return t.tbd?israelDate(t.iso,23,59).getTime():t.date.getTime()+3*3600000; }
const heDate=(d,o)=>new Intl.DateTimeFormat("he-IL",{timeZone:TZ,...o}).format(d);
const longDate=d=>heDate(d,{weekday:"long",day:"numeric",month:"long"});
function shortName(n){ return heb(String(n).replace(/^(מ\.כ\.?|מ\.ס\.?|ה\.|מועדון הכדורגל|מרכז קהילתי|איחוד)\s*/,"").replace(/\s*צו פיוס\s*$/,"").trim()||n); }
function initials(n){ const w=shortName(n).replace(/^(הפועל|הפ׳|מכבי|בית״ר|ביתר|בני|עירוני)\s+/,"").split(/\s+/).filter(x=>/[א-ת]/.test(x)); return (w[0]?.[0]||"?")+(w[1]?.[0]||""); }
const isMe=t=>t&&(t.id===ME.id||t.name.includes(CFG.team.match));
const tname=t=>isMe(t)?CFG.team.displayName:shortName(t.name);
const mine=g=>isMe(g.home)||isMe(g.away);
const played=g=>g.home.goals!==null&&g.away.goals!==null;
function outcome(g,id){ if(!played(g)||!id||(g.home.id!==id&&g.away.id!==id)) return null; const h=g.home.id===id; const a=h?g.home.goals:g.away.goals,b=h?g.away.goals:g.home.goals; return a>b?"W":a<b?"L":"D"; }
const OUT_US={W:"ניצחנו",D:"תיקו",L:"הפסדנו"}, OUT={W:"ניצחון",D:"תיקו",L:"הפסד"}, OUTC={W:"win",D:"draw",L:"loss"};
const teamGames=id=>DATA.games.filter(g=>g.home.id===id||g.away.id===id).sort((a,b)=>a.date.localeCompare(b.date));
const findGame=id=>DATA.games.find(g=>g.id===id)||CUP.find(g=>g.id===id);
const myGames=()=>teamGames(ME.id).concat(CUP).sort((a,b)=>a.date.localeCompare(b.date));
const roundLabel=g=>g.cup?`גביע · ${heb(g.roundName||"")}`:`מחזור ${g.round}`;
const formOf=(id,n=5)=>teamGames(id).filter(played).slice(-n).map(g=>outcome(g,id));
function computeTable(maxRound=Infinity){
  const t=new Map(); for(const tm of DATA.teams) t.set(tm.id,{id:tm.id,name:tm.name,games:0,wins:0,draws:0,losses:0,gf:0,ga:0,points:0});
  for(const g of DATA.games){ if(!played(g)||g.round>maxRound) continue; const h=t.get(g.home.id),a=t.get(g.away.id); if(!h||!a) continue;
    h.games++;a.games++;h.gf+=g.home.goals;h.ga+=g.away.goals;a.gf+=g.away.goals;a.ga+=g.home.goals;
    if(g.home.goals>g.away.goals){h.wins++;a.losses++;h.points+=3;} else if(g.home.goals<g.away.goals){a.wins++;h.losses++;a.points+=3;} else {h.draws++;a.draws++;h.points++;a.points++;} }
  const arr=[...t.values()].map(x=>({...x,gd:x.gf-x.ga}));
  arr.sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name,"he")); arr.forEach((x,i)=>x.rank=i+1); return arr;
}
const lastPlayedRound=()=>Math.max(0,...DATA.games.filter(played).map(g=>g.round));
// only plain https links ever become buttons (blocks javascript: and data: links)
const safeUrl=u=>/^https:\/\/[^\s"<>]+$/i.test(u||"")?u:"";
const venueOf=(g,home)=>{ const ov=OVR?.games?.[g.id]||{}; const hv=OVR?.venues?.home||{}; return {venue:ov.venue||g.ifa?.venue||(home?hv.name||"":""),waze:safeUrl(ov.waze||(home?hv.waze||"":"")),note:ov.note||(home?hv.note||"":"")}; };
const scoreLtr=g=>`<span class="n">${g.away.goals}</span><i>:</i><span class="n">${g.home.goals}</span>`; // home sits on the right in RTL
// league position box (replaces initials). Before a team has played, the rank is meaningless, so say so.
const rankBox=(row,me=false)=>`<div class="mark rank ${me?"me":""}" aria-label="${row?.games?`מקום ${row.rank} בטבלה`:"טרם שיחקו"}">${row?.games?`<b>${row.rank}</b><small>מקום</small>`:`<small class="na">טרם<br>שיחקו</small>`}</div>`;
const computeNext=()=>myGames().find(g=>!played(g)&&expiresAt(g)>Date.now())||null;
function fit(el){ const max=+el.dataset.fit,min=+el.dataset.min||max*.6; let s=max; el.style.fontSize=s+"px"; while(el.scrollHeight>s*.95*2+6&&s>min){ s-=2; el.style.fontSize=s+"px"; } }
const fitAll=(r=document)=>r.querySelectorAll("[data-fit]").forEach(fit);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitAll());

const ICONS={
  share:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8h16v-8M16 6l-4-4-4 4M12 2v13"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>`,

  btn.innerHTML=ICONS.check+(btn.classList.contains("sq")?"":`<span>${label}</span>`); btn.classList.add("ok");

function formStrip(form,sm=false){
  const cells=[...form]; while(cells.length<5) cells.unshift("E");
  // first in DOM sits on the right (oldest), last on the left (newest)
  return `<span class="form ${sm?"sm":""}" aria-label="כושר אחרון">${cells.map((o,i)=>`<span class="chev ${o}" style="--i:${i}">${o==="E"?"":o==="W"?"נ":o==="D"?"ת":"ה"}</span>`).join("")}</span>`;
}
function startCountdown(next){
  clearInterval(cdTimer); const el=$("#cd"); if(!el||!next) return;
  const t=gameTime(next); let mode="";
  const two=n=>String(Math.max(0,n)).padStart(2,"0");
  const cell=(k,lab)=>`<div class="cell"><div class="digits"><span class="d" data-k="${k}0"></span><span class="d" data-k="${k}1"></span></div><div class="lab">${lab}</div></div>`;
  const big=s=>`<div class="today">${s}</div>`;
  const tick=()=>{
    const now=Date.now(); let nm,vals={},label="";
    if(now>expiresAt(next)){ NEXT=computeNext(); renderHome(); return; }
    if(t.tbd){
      const days=Math.round((israelDate(t.iso,12,0).getTime()-israelDate(todayIso(),12,0).getTime())/86400000);
      nm=days<=0?"t-today":days===1?"t-tomorrow":"t-days"; vals=nm==="t-days"?{a:two(days)}:{};
    } else {
      const kick=t.date.getTime(),diff=kick-now;
      if(diff<=0) nm=now<kick+100*60000?"live":"done";
      else { const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
        if(d>0){nm="dhm";vals={a:two(d),b:two(h),c:two(m)};}
        else if(h>0){nm="hms";vals={a:two(h),b:two(m),c:two(s)};}
        else {nm="ms";vals={a:two(m),b:two(s)};label=m>0?`בעוד ${m} דק׳`:"פחות מדקה";} }
    }
    if(nm!==mode){
      const first=!mode; mode=nm;
      el.className="cd"+(["t-days","t-today","t-tomorrow","live","done"].includes(nm)?" single":nm==="ms"?" two":"");
      el.innerHTML=nm==="t-days"?cell("a","ימים למשחק, בערך")
        :nm==="t-today"?big("מתוכנן להיום")+`<div class="lab c">השעה טרם פורסמה, והמועד עוד יכול לזוז</div>`
        :nm==="t-tomorrow"?big("מתוכנן למחר")+`<div class="lab c">השעה טרם פורסמה, והמועד עוד יכול לזוז</div>`
        :nm==="live"?big("המשחק בעיצומו")
        :nm==="done"?big("המשחק הסתיים")+`<div class="lab c">התוצאה תתעדכן כשתפורסם</div>`
        :nm==="dhm"?cell("a","ימים")+cell("b","שעות")+cell("c","דקות")
        :nm==="hms"?big("היום")+cell("a","שעות")+cell("b","דקות")+cell("c","שניות")
        :big(label)+cell("a","דקות")+cell("b","שניות");
      if(!first&&!REDUCED) el.animate([{opacity:0},{opacity:1}],{duration:160,easing:"ease-out"});
    }
    if(nm==="ms") el.querySelector(".today").textContent=label;
    for(const k in vals){ const v=vals[k]; for(const i of [0,1]){ const b=el.querySelector(`[data-k="${k}${i}"]`); if(!b||b.textContent===v[i]) continue; const had=b.textContent!==""; b.textContent=v[i]; if(had&&!REDUCED) b.animate([{transform:"translateY(-14%)"},{transform:"none"}],{duration:200,easing:"cubic-bezier(.23,1,.32,1)"}); } }
  };
  tick(); cdTimer=setInterval(tick,1000);
}
function tickerHtml(){

  const gs=DATA.games.filter(g=>g.round===lr&&played(g)); if(!gs.length) return "";
  const items=gs.map(g=>`<span class="it ${mine(g)?"me":""}"><span>${esc(tname(g.home))}</span><b class="sc">${scoreLtr(g)}</b><span>${esc(tname(g.away))}</span></span>`).join("");

let tickerIO=null;
function armTicker(){ if(tickerIO) tickerIO.disconnect(); const t=$("#ticker"); if(!t||REDUCED) return; tickerIO=new IntersectionObserver(es=>es.forEach(e=>t.classList.toggle("play",e.isIntersecting)),{threshold:.2}); tickerIO.observe(t); }
function armReveal(){

  const p0=parts(gameTime(my[0]).date),p1=parts(gameTime(my[my.length-1]).date);

    const key=`${y}-${String(m).padStart(2,"0")}`, gs=my.filter(g=>gameTime(g).iso.startsWith(key));
    const name=new Intl.DateTimeFormat("he-IL",{timeZone:"UTC",month:"long"}).format(new Date(Date.UTC(y,m-1,1)));
    return `<div class="month">${esc(name)}<small>${y}</small></div>`+(gs.length?`<div class="list">${gs.map((g,i)=>ticket(g,i)).join("")}</div>`:`<div class="emptyMonth">אין משחקים בחודש הזה</div>`);
  }).join("");
}

/* ---------- sheet ---------- */
const sheet=$("#sheet"),scrim=$("#scrim");
const sheetOpen=()=>sheet.classList.contains("on");
function openSheet(html){
  const was=sheetOpen(); $("#sheetBody").innerHTML=html; sheet.scrollTop=0; sheet.style.transform=""; scrim.style.opacity="";
  sheet.classList.add("on"); scrim.classList.add("on"); fitAll(sheet);
  if(!was){ try{ history.pushState({sheet:1},"",location.href); }catch{} }
}
function hideSheet(){ sheet.style.transition=""; sheet.style.transform=""; scrim.style.opacity=""; sheet.classList.remove("on"); scrim.classList.remove("on"); }
function closeSheet(){ if(!sheetOpen()) return; if(history.state&&history.state.sheet) history.back(); else hideSheet(); }
addEventListener("popstate",()=>{ if(sheetOpen()) hideSheet(); });
scrim.addEventListener("click",closeSheet);
// drag to dismiss: follows the finger, closes on distance or a quick flick
(() => {
  let y0=0,t0=0,dy=0,drag=false,armed=false;
  sheet.addEventListener("touchstart",e=>{ if(e.touches.length>1){armed=false;return;} armed=sheet.scrollTop<=0||!!e.target.closest(".grab"); y0=e.touches[0].clientY; t0=performance.now(); dy=0; drag=false; },{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(!armed) return; dy=e.touches[0].clientY-y0;
    if(!drag){ if(dy>6&&sheet.scrollTop<=0) drag=true; else if(dy<0){armed=false;return;} else return; }
    e.preventDefault();
    const y=Math.max(0,dy); sheet.style.transition="none"; sheet.style.transform=`translateY(${y}px)`;
    scrim.style.transition="none"; scrim.style.opacity=String(Math.max(0,1-y/sheet.offsetHeight));
  },{passive:false});
  sheet.addEventListener("touchend",()=>{
    if(!drag){ armed=false; return; } drag=false; armed=false;
    const v=dy/Math.max(1,performance.now()-t0); scrim.style.transition="";
    if(dy>sheet.offsetHeight/3||(v>.11&&dy>24)){ sheet.style.transition=""; closeSheet(); }
    else { sheet.style.transition=""; sheet.style.transform=""; scrim.style.opacity=""; }
  });
})();
function teamSheet(id){
  const tm=DATA.teams.find(t=>t.id===id); if(!tm) return;
  const row=computeTable().find(r=>r.id===id),gs=teamGames(id),recent=gs.filter(played).slice(-5).reverse(),form=formOf(id);
  const me=id===ME.id,h2h=gs.filter(mine),h2hDone=h2h.filter(played),nextVs=h2h.find(g=>!played(g));
  const avg=(n,d)=>d?(n/d).toFixed(1):"0.0";
  let html=`<div class="sheet-h">${rankBox(row,me)}<div><h3 class="fit" data-fit="38" data-min="24">${esc(me?CFG.team.displayName:heb(tm.name))}</h3><div class="sub">${row?.games?`מקום ${row.rank} · ${row.points} נק׳ · ${row.games} משחקים`:"עוד לא שיחקו העונה"}</div></div></div>
    <div class="tiles"><div class="tile"><b>${row?.wins??0}</b><span>ניצחונות</span></div><div class="tile"><b>${row?.draws??0}</b><span>תיקו</span></div><div class="tile"><b>${row?.losses??0}</b><span>הפסדים</span></div><div class="tile"><b>${avg(row?.gf,row?.games)}</b><span>שערים למשחק</span></div></div>
    <div class="formRow"><span>כושר אחרון</span>${formStrip(form)}</div>`;
  if(!me){ html+=`<div class="h3">מול ${esc(CFG.team.displayName)}</div>`;
    if(h2hDone.length) html+=`<div class="list">${h2hDone.slice().reverse().map(g=>ticket(g,0)).join("")}</div>`;
    else if(nextVs){ const t=gameTime(nextVs); html+=`<div class="emptyLine">עוד לא נפגשנו העונה. המפגש הראשון: ${esc(longDate(t.date))}, ${isMe(nextVs.home)?"אצלנו":"אצלם"}.</div>`; } }
  html+=`<div class="h3">המשחקים האחרונים ${me?"שלנו":"שלהם"}</div>`+(recent.length?`<div class="list">${recent.map(g=>ticket(g,0,id)).join("")}</div>`:`<div class="emptyLine">עוד לא שוחקו משחקים העונה.</div>`);
  const up=gs.filter(g=>!played(g)).slice(0,3); if(up.length) html+=`<div class="h3">המשחקים הבאים ${me?"שלנו":"שלהם"}</div><div class="list">${up.map(g=>ticket(g,0,id)).join("")}</div>`;
  openSheet(html);
}
function gameSheet(id){
  const g=findGame(id); if(!g) return;
  if(mine(g)&&DATA.teams.some(t=>t.id===(isMe(g.home)?g.away.id:g.home.id))) return teamSheet(isMe(g.home)?g.away.id:g.home.id);
  const t=gameTime(g);
  openSheet(`<div class="sheet-h"><div><h3 class="fit" data-fit="34" data-min="22"><bdi>${esc(shortName(g.home.name))}</bdi> נגד <bdi>${esc(shortName(g.away.name))}</bdi></h3><div class="sub">${esc(longDate(t.date))}${t.tbd?"":" · "+t.timeStr} · ${esc(roundLabel(g))}</div></div></div>
    ${played(g)?`<div class="led"><div class="row"><div class="t">${esc(shortName(g.home.name))}</div><div class="sc">${scoreLtr(g)}</div><div class="t">${esc(shortName(g.away.name))}</div></div></div>`:""}
    ${g.cup?`<p class="emptyLine" style="margin-top:12px">${esc(heb(DATA.cup?.name||"גביע"))}. היריבה משחקת בליגה אחרת, ולכן אין לנו את הטבלה שלה.</p>`:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><button class="btn press" data-act="opp" data-id="${g.home.id}"><span class="iso">${esc(shortName(g.home.name))}</span></button><button class="btn press" data-act="opp" data-id="${g.away.id}"><span class="iso">${esc(shortName(g.away.name))}</span></button></div>`}`);
}

/* ---------- confetti (rare: once per win, from the stamp) ---------- */
function confetti(x,y){
  if(REDUCED) return; const c=$("#confetti"); c.hidden=false; const ctx=c.getContext("2d");
  const dpr=Math.min(2,devicePixelRatio||1); c.width=innerWidth*dpr; c.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#1E56C8","#FAFBFE","#5B9BFF","#3CCB7F"];
  const ps=Array.from({length:90},()=>({x,y,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:Math.random()*Math.PI,va:(Math.random()-.5)*.3}));
  const t0=performance.now(); const loop=t=>{ const el=(t-t0)/1000; ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of ps){ p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-el/2);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore(); }
    if(el<2) requestAnimationFrame(loop); else c.hidden=true; }; requestAnimationFrame(loop);
}

/* ---------- navigation ---------- */
function renderView(v,first){ if(v==="games") renderGames(first); else if(v==="table") renderTable(first); else if(v==="cal") renderCal(); }
function showView(v){
  if(v===state.view){ scrollTo({top:0,behavior:REDUCED?"instant":"smooth"}); return; }
  scrollPos[state.view]=scrollY; state.view=v;
  const first=!seen.has(v); seen.add(v);
  const el=$("#v-"+v);
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s===el));
  el.classList.toggle("first",first); if(first) setTimeout(()=>el.classList.remove("first"),800);
  document.querySelectorAll(".nav button").forEach(b=>{ if(b.dataset.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  scrollTo({top:0,behavior:"instant"});
  if(DATA) renderView(v,first);
  if(!first) scrollTo({top:scrollPos[v]||0,behavior:"instant"});
  try{ history.replaceState(history.state,"","#"+v); }catch{}
}
document.addEventListener("click",e=>{
  const fl=e.target.closest("[data-flash]"); if(fl){ flash(fl,fl.dataset.flash); return; }
  const nv=e.target.closest("[data-view]"); if(nv){ showView(nv.dataset.view); return; }
  const rb=e.target.closest("[data-round]"); if(rb){ state.round=Number(rb.dataset.round); renderGames(false); return; }
  const cr=e.target.closest("[data-cup]"); if(cr){ state.gamesMode=2; $("#gamesSeg").dataset.i=2; $("#gamesSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.i==="2")); if(state.view==="games") renderGames(false); else showView("games"); return; }
  const sg=e.target.closest("#gamesSeg button"); if(sg){ state.gamesMode=Number(sg.dataset.i); $("#gamesSeg").dataset.i=state.gamesMode; $("#gamesSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b===sg)); renderGames(false); return; }
  const a=e.target.closest("[data-act]"); if(!a||!DATA) return; const id=a.dataset.id,act=a.dataset.act;
  if(act==="share") share(gameText(findGame(id))).then(ok=>ok&&flash(a,"נשלח"));
  else if(act==="opp") teamSheet(id);
  else if(act==="game") gameSheet(id);
  else if(act==="install"&&installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; renderInstall(); }); }
  else if(act==="install-x"){ LS.set("gd-install-x",String(Date.now())); renderInstall(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeSheet(); return; }
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});
$("#shareSeason").addEventListener("click",()=>{ if(!DATA) return; const btn=$("#shareSeason");
  const l=[`⚽ לוח המשחקים של ${CFG.team.displayName}`,""];
  for(const g of teamGames(ME.id).filter(g=>!played(g))){ const t=gameTime(g),home=isMe(g.home); l.push(`${heDate(t.date,{day:"2-digit",month:"2-digit"})} ${t.tbd?"":t.timeStr+" "}${home?"🏠":"🚌"} ${shortName(home?g.away.name:g.home.name)}`); }
  share(l.join("\n")).then(ok=>ok&&flash(btn,"נשלח")); });

/* ---------- pull to refresh (home only) ---------- */
(() => {
  const ptr=$("#ptr"),label=ptr.querySelector(".stamp"),home=$("#v-home"); let y0=null,pull=0,busy=false,over=false;
  const set=(px,anim)=>{ for(const el of [home,ptr]) el.style.transition=anim?"transform 260ms cubic-bezier(.32,.72,0,1),opacity 200ms ease":"none";
    home.style.transform=px?`translateY(${px}px)`:""; ptr.style.transform=`translateY(${px-56}px)`; ptr.style.opacity=String(Math.min(1,px/56)); };
  document.addEventListener("touchstart",e=>{ y0=(state.view!=="home"||busy||sheetOpen()||scrollY>0||e.touches.length>1)?null:e.touches[0].clientY; pull=0; over=false; },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(y0===null) return; const dy=e.touches[0].clientY-y0;
    if(dy<=0||scrollY>0){ if(pull) set(0,false); pull=0; if(scrollY>0) y0=null; return; }
    e.preventDefault(); pull=Math.min(120,dy*.5); set(pull,false);
    const o=pull>70; if(o!==over){ over=o; label.textContent=o?"שחררו לרענון":"משכו לרענון"; if(o&&navigator.vibrate) navigator.vibrate(8); }
  },{passive:false});
  document.addEventListener("touchend",async()=>{
    if(y0===null) return; y0=null;
    if(pull>70&&!busy){ busy=true; label.textContent="מרענן"; set(56,true);
      const r=await load(); label.textContent=r==="new"?"עודכן עכשיו":r==="same"?"אין חדש":"אין חיבור";
      await wait(800); set(0,true); await wait(280); label.textContent="משכו לרענון"; busy=false; }
    else if(pull) set(0,true);
  });
})();

/* ---------- data: snapshot first, then network ---------- */
function relTime(iso){ const m=Math.round((Date.now()-new Date(iso).getTime())/60000); if(m<1) return "ממש עכשיו"; if(m<60) return `לפני ${m} דק׳`; const h=Math.round(m/60); if(h===1) return "לפני שעה"; if(h===2) return "לפני שעתיים"; if(h<48) return `לפני ${h} שעות`; const d=Math.round(h/24); return d===2?"לפני יומיים":`לפני ${d} ימים`; }
function updateStamp(){
  if(!DATA) return; const stale=document.body.classList.contains("stale");
  $("#updated").innerHTML=stale?`אין חיבור. מוצגים הנתונים שנשמרו ${esc(relTime(DATA.fetchedAt))}`
    :`הנתונים מאתר ONE, עודכנו ${esc(relTime(DATA.fetchedAt))} · <a href="https://vole.one.co.il/league/${DATA.league.id}" target="_blank" rel="noopener">לעמוד הליגה</a>`;
}
function init(d,c,o){
  const m=d.teams.find(x=>x.name.includes(c.team.match)); if(!m) throw new Error("הקבוצה לא נמצאה בליגה: "+c.team.match);
  DATA=d; CFG=c; OVR=o||{}; ME=m; CUP=(d.cup?.games||[]).map(g=>({...g,cup:true}));
  $("#teamTitle").textContent=CFG.team.displayName; document.title=heb(CFG.site?.title||document.title);
  NEXT=computeNext(); renderHome(); if(state.view!=="home") renderView(state.view,false); updateStamp();
}
async function getJSON(u,ms){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(`${u}?v=${Date.now()}`,{cache:"no-store",signal:c.signal}); if(!r.ok) throw new Error(`${u} ${r.status}`); return await r.json(); }
  finally{ clearTimeout(tm); }
}
async function load(){
  try{
    const [d,c,o]=await Promise.all([getJSON("data.json",9000),getJSON("config.json",9000),getJSON("overrides.json",9000).catch(()=>({}))]);
    lastFetch=Date.now(); document.body.classList.remove("stale");
    LS.set("gd-snap",JSON.stringify({d,c,o}));
    const changed=!DATA||d.fetchedAt!==DATA.fetchedAt||JSON.stringify(o)!==JSON.stringify(OVR)||JSON.stringify(c)!==JSON.stringify(CFG);
    if(changed) init(d,c,o); else updateStamp();
    return changed?"new":"same";
  }catch(e){
    if(DATA){ document.body.classList.add("stale"); updateStamp(); return "fail"; }
    $("#homeBody").innerHTML=`<div class="err">לא הצלחנו לטעון את הנתונים. ${esc(e.message)}<br><small>בדקו חיבור לאינטרנט ונסו שוב.</small></div>`; return "fail";
  }
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!DATA) return;
  const n=computeNext(); if(n!==NEXT){ NEXT=n; renderHome(); } else startCountdown(NEXT);
  if(Date.now()-lastFetch>5*60000) load();
});
(async function boot(){
  LS.set("gd-visits",String(+(LS.get("gd-visits")||0)+1));
  const hash=(location.hash||"").slice(1);
  let warm=false;
  if(!LS.get("gd-snap")){ $("#v-home").classList.add("first"); setTimeout(()=>$("#v-home").classList.remove("first"),1200); }
  try{ const s=JSON.parse(LS.get("gd-snap")||"null"); if(s&&s.d&&s.c){ init(s.d,s.c,s.o); warm=true; } }catch{}
  seen.add("home");
  if(["games","table","cal"].includes(hash)) showView(hash);
  await load();
})();
})();
</script>
