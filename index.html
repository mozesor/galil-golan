<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#1E56C8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="לוח המשחקים של גליל גולן דרום, ילדים ב'. המשחק הבא, תוצאות, טבלה ויומן. מתעדכן אוטומטית." />
<title>גליל גולן דרום | ילדים ב'</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   חולצת הבית: בזלת, ענבר, צעיף, מספר גב, גיר, כרטיס, לוח LED
   ========================================================= */
:root{
  --bg:#EEF2F8; --surface:#FAFBFE; --ink:#0F1B2D; --muted:#55627A;
  --amber:#1E56C8; --amber-ink:#FAFBFE; --blue:#0F1B2D; --blue-ink:#FAFBFE;
  --win:#1E8E4F; --draw:#6F7A8E; --loss:#C62828;
  --line:rgba(15,27,45,.12); --line-strong:rgba(15,27,45,.3); --chalk:rgba(15,27,45,.45);
  --led:#0B1220; --led-ink:#F3F6FB;
  --hero-bg:#EEF2F8; --hero-ink:#0F1B2D; --hero-muted:#55627A; --hero-chalk:rgba(15,27,45,.5);
  --shadow-hard:3px 3px 0 var(--ink);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1); --ease-slam:cubic-bezier(.2,.8,.2,1);
  --display:"Karantina","Arial Narrow","Noto Sans Hebrew",sans-serif;
  --body:"Rubik","Noto Sans Hebrew",system-ui,sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#141E30; --ink:#F3F6FB; --muted:#A3AFC4;
  --amber:#5B9BFF; --amber-ink:#0B1220; --blue:#F3F6FB; --blue-ink:#0B1220;
  --win:#3CCB7F; --draw:#8E99AE; --loss:#E8453C;
  --line:rgba(243,246,251,.12); --line-strong:rgba(243,246,251,.3); --chalk:rgba(243,246,251,.45);
  --hero-bg:#0B1220; --hero-ink:#F3F6FB; --hero-muted:#A3AFC4; --hero-chalk:rgba(243,246,251,.5);
  --shadow-hard:3px 3px 0 var(--amber);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#141E30; --ink:#F3F6FB; --muted:#A3AFC4;
    --amber:#5B9BFF; --amber-ink:#0B1220; --blue:#F3F6FB; --blue-ink:#0B1220;
    --win:#3CCB7F; --draw:#8E99AE; --loss:#E8453C;
    --line:rgba(243,246,251,.12); --line-strong:rgba(243,246,251,.3); --chalk:rgba(243,246,251,.45);
    --hero-bg:#0B1220; --hero-ink:#F3F6FB; --hero-muted:#A3AFC4; --hero-chalk:rgba(243,246,251,.5);
    --shadow-hard:3px 3px 0 var(--amber);
    color-scheme:dark;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  overscroll-behavior-y:contain;font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:700}
.display{font-family:var(--display);font-weight:700;line-height:.9;letter-spacing:0}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}
.press{transition:transform 140ms var(--ease-out)}
.press:active{transform:scale(.97)}

/* ---------- scarf bar ---------- */
.scarf{
  position:sticky;top:0;z-index:20;height:calc(52px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:grid;grid-template-columns:1fr 1fr;align-items:stretch;overflow:hidden;
  background:#FAFBFE;border-bottom:2px solid #1E56C8;
}
.scarf .a{
  background:#1E56C8;color:#FAFBFE;
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);
  display:flex;align-items:center;padding-inline:16px 24px;gap:10px;
}
.scarf .b{color:#0F1B2D;display:flex;align-items:center;justify-content:space-between;padding-inline:4px 12px}
.scarf .name{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;white-space:nowrap}
.scarf .cat{font-family:var(--display);font-weight:400;font-size:20px;line-height:1;opacity:.9;white-space:nowrap}
.scarf.enter{animation:scarfIn 380ms var(--ease-slam) both}
@keyframes scarfIn{from{transform:translateY(-100%)}to{transform:none}}
.themeBtn{width:40px;height:40px;display:grid;place-items:center;border:2px solid #1E56C8;color:#1E56C8;border-radius:0}
.themeBtn svg{width:18px;height:18px}

/* ---------- layout ---------- */
.app{max-width:640px;margin:0 auto;padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
.pad{padding-inline:16px}
.view{display:none}
.view.on{display:block;animation:viewIn 260ms var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;margin:28px 0 12px}
.h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:10px;vertical-align:middle}
.rise{animation:rise 420ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- stamp ---------- */
.stamp{
  display:inline-block;transform:rotate(-8deg);font-family:var(--display);font-weight:700;font-size:22px;line-height:1;
  padding:4px 10px 3px;border:2px solid var(--c,var(--ink));color:var(--c,var(--ink));
  box-shadow:0 0 0 3px transparent,0 0 0 4px var(--c,var(--ink));box-shadow:inset 0 0 0 0 transparent,0 0 0 3px var(--bg),0 0 0 4px var(--c,var(--ink));
  white-space:nowrap;background:transparent;
}
.stamp.big{font-size:30px;padding:5px 12px 4px}
.stamp.slam{animation:slam 260ms var(--ease-slam) both}
@keyframes slam{from{opacity:0;transform:rotate(-8deg) scale(1.6)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.stamp.amber{--c:var(--amber)}
.stamp.blue{--c:var(--muted)}
.stamp.win{--c:var(--win)}.stamp.draw{--c:var(--draw)}.stamp.loss{--c:var(--loss)}

/* ---------- jersey mark ---------- */
.mark{
  flex:none;display:grid;place-items:center;border:2px solid currentColor;
  font-family:var(--display);font-weight:700;line-height:1;
  width:var(--s,44px);height:var(--s,44px);font-size:calc(var(--s,44px) * .52);
}
.mark.me{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);
  padding:50px 16px 0;
}
.hero::before{ /* jersey collar: diagonal stripe band across the top, never under text */
  content:"";position:absolute;top:0;left:0;right:0;height:30px;
  background:repeating-linear-gradient(135deg,var(--amber) 0 22px,transparent 22px 44px);
  pointer-events:none;
}
:root[data-theme="dark"] .hero::after,
.hero.grain::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.hero > *{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.eyebrow{font-weight:600;font-size:12px;color:var(--amber);letter-spacing:0}
:root:not([data-theme="dark"]) .eyebrow{color:var(--ink)}
.eyebrow b{display:inline-block;background:var(--amber);color:var(--amber-ink);padding:2px 8px;font-weight:600}
.opp{display:flex;align-items:center;gap:14px;margin-top:18px}
.opp .mark{--s:96px;border-width:3px}
.opp .who{min-width:0}
.opp .pre{font-size:13px;font-weight:500;color:var(--hero-muted)}
.opp .name{font-family:var(--display);font-weight:700;font-size:56px;line-height:.9;overflow-wrap:anywhere}
@media (max-width:360px){.opp .name{font-size:46px}}
.chalk{height:0;border-top:2px dashed var(--hero-chalk);margin:18px 0 14px}
.details{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}
.details .when{font-weight:500;font-size:16px;line-height:1.3}
.details .where{font-size:14px;color:var(--hero-muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.details .where svg{width:14px;height:14px;flex:none}
.details .time{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;color:var(--amber)}
:root:not([data-theme="dark"]) .details .time{color:var(--ink)}
.cd{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 0;position:relative}
.cd.single{grid-template-columns:1fr}
.cd .cell{text-align:center;padding:8px 0 10px;border-inline-start:2px dashed var(--hero-chalk)}
.cd .cell:first-child{border-inline-start:0}
.cd .digits{font-family:var(--display);font-weight:700;font-size:104px;line-height:.86;display:inline-flex;direction:ltr;letter-spacing:.01em}
.cd.single .digits{font-size:120px}
.cd .d{display:inline-block;width:.46em;text-align:center;overflow:hidden}
.cd .d.tick{animation:tickIn 220ms var(--ease-out)}
@keyframes tickIn{from{transform:translateY(-14%);opacity:.4}to{transform:none;opacity:1}}
.cd .lab{font-weight:600;font-size:13px;color:var(--hero-muted);margin-top:2px}
.cd .today{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;text-align:center;padding:14px 0 6px}
.tear{ /* perforated tear line */
  height:16px;margin:14px -16px 0;
  background:radial-gradient(circle at 7px 8px,var(--bg) 6px,transparent 7px) 0 0/14px 16px repeat-x;
}
.actions{display:grid;grid-template-columns:1fr 56px 56px;gap:10px;padding:14px 16px 20px;background:var(--surface);border-bottom:2px solid var(--ink)}
.btn{
  height:56px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:16px;border:2px solid var(--ink);color:var(--ink);background:transparent;white-space:nowrap;
}
.btn svg{width:22px;height:22px;flex:none}
.btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.blue{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.sq{padding:0}
.note{margin:12px 0 0;padding:10px 12px;border-inline-start:4px solid var(--amber);background:var(--surface);font-size:14px;line-height:1.45}

/* ---------- LED board ---------- */
.led{
  background:var(--led);color:var(--led-ink);position:relative;overflow:hidden;
  padding:18px 16px 16px;margin-top:14px;
}
.led::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.led > *{position:relative}
.led .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.led .t{font-family:var(--display);font-weight:700;font-size:24px;line-height:.95;overflow-wrap:anywhere;text-align:center}
.led .t.me{color:var(--amber)}
.led .sc{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;direction:ltr;unicode-bidi:isolate;white-space:nowrap;color:#F3F6FB}
.led .sc.W{color:#3CCB7F}.led .sc.L{color:#E8453C}.led .sc.D{color:#A3AFC4}
.led .sc i{font-style:normal;opacity:.5;margin:0 6px}
.led .meta{text-align:center;font-size:13px;color:#A3AFC4;margin-top:8px}
.led .stampWrap{position:absolute;top:10px;inset-inline-end:12px}
.led .stamp{box-shadow:0 0 0 3px var(--led),0 0 0 4px var(--c)}

/* ---------- form chevrons ---------- */
.form{display:inline-flex;gap:2px;direction:rtl}
.chev{
  width:40px;height:26px;display:grid;place-items:center;color:#F3F6FB;
  font-family:var(--display);font-weight:700;font-size:20px;line-height:1;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);
  transform-origin:right center;animation:chevIn 220ms var(--ease-slam) both;animation-delay:calc(var(--i,0) * 60ms);
}
.chev.W{background:var(--win)}.chev.D{background:var(--draw)}.chev.L{background:var(--loss)}
.chev.E{background:transparent;outline:2px dashed var(--line-strong);outline-offset:-2px;clip-path:none;width:32px}
.form.sm .chev{width:24px;height:16px;font-size:0;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 50%,calc(100% - 5px) 100%,0 100%,5px 50%)}
.form.sm .chev.E{width:18px}
@keyframes chevIn{from{transform:scaleX(0)}to{transform:none}}

/* ---------- season tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);background:var(--surface)}
.tile{padding:12px 6px 10px;text-align:center;border-inline-start:1px dashed var(--line-strong)}
.tile:first-child{border-inline-start:0}
.tile b{display:block;font-family:var(--display);font-weight:700;font-size:40px;line-height:.9}
.tile span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.formRow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:2px solid var(--ink);border-top:0;background:var(--surface);font-weight:600;font-size:14px}

/* ---------- ticket list ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.tk{
  display:grid;grid-template-columns:64px 1fr 92px;align-items:stretch;
  background:var(--surface);border:2px solid var(--ink);text-align:start;width:100%;position:relative;
}
.tk.next{box-shadow:var(--shadow-hard)}
.tk .dt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-inline-end:2px dashed var(--line-strong)}
.tk .dt b{font-family:var(--display);font-weight:700;font-size:36px;line-height:.9}
.tk .dt span{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px;text-align:center;line-height:1.2}
.tk .mid{padding:10px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tk .mid .n{font-weight:600;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .mid .n.me{color:var(--amber);color:color-mix(in srgb,var(--amber) 70%,var(--ink))}
:root[data-theme="dark"] .tk .mid .n.me{color:var(--amber)}
.tk .mid .m{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tk .tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border:1.5px solid currentColor}
.tk .tag.blue{color:var(--muted)}
.tk .stub{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-inline-start:2px dashed var(--line-strong);padding:6px 4px;position:relative;
}
.tk .stub::before,.tk .stub::after{content:"";position:absolute;inset-inline-start:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tk .stub::before{top:-10px;clip-path:inset(50% 0 0 0)}
.tk .stub::after{bottom:-10px;clip-path:inset(0 0 50% 0)}
.tk .sc{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.tk .sc.W{color:var(--win)}.tk .sc.L{color:var(--loss)}.tk .sc.D{color:var(--draw)}
.tk .tm{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.tk .tbd{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.tk .r{font-size:11px;color:var(--muted);font-weight:600}
.month{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
.month small{font-weight:400;font-size:28px;color:var(--muted)}
.month:first-child{margin-top:4px}
.emptyMonth{font-size:14px;color:var(--muted);padding:8px 2px 4px}

/* segmented + rounds */
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);position:relative;margin:16px 0 12px;background:var(--surface)}
.seg button{position:relative;z-index:1;height:44px;font-weight:600;font-size:15px;color:var(--muted);transition:color 160ms}
.seg button[aria-selected="true"]{color:var(--amber-ink)}
.seg .thumb{position:absolute;top:0;bottom:0;inset-inline-start:0;width:50%;background:var(--amber);transition:transform 260ms var(--ease-out)}
.seg[data-i="1"] .thumb{transform:translateX(-100%)}
.rounds{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scroll-snap-type:x proximity;scrollbar-width:none}
.rounds[hidden]{display:none}
.rounds::-webkit-scrollbar{display:none}
.rounds button{flex:none;height:36px;padding:0 12px;border:2px solid var(--line-strong);font-weight:600;font-size:13px;color:var(--muted);scroll-snap-align:center;background:var(--surface)}
.rounds button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:8px 4px;border-bottom:2px solid var(--ink);position:sticky;top:calc(52px + env(safe-area-inset-top));background:var(--bg);z-index:2}
.tbl th.l{text-align:start}
.tbl td{padding:0 4px;height:52px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:nth-child(4n) td{border-bottom:1px solid var(--line-strong)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.rk{font-family:var(--display);font-weight:400;font-size:26px;width:34px;color:var(--muted)}
.tbl td.l{text-align:start;font-weight:500;max-width:0;width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td.l .mark{--s:30px;display:inline-grid;vertical-align:middle;margin-inline-end:8px;font-size:15px}
.tbl td.pt{font-family:var(--display);font-weight:700;font-size:28px;width:44px}
.tbl td.gd{color:var(--muted);font-size:14px}
.tbl tr{cursor:pointer}
.tbl tr.rise{animation-delay:calc(var(--i,0) * 35ms)}
.tbl tr.me td{background:color-mix(in srgb,var(--amber) 18%,transparent)}
.tbl tr.me td.rk{color:var(--ink);font-weight:700;box-shadow:inset 6px 0 0 var(--amber)}
.tbl tr.me td.l{font-weight:600}
.tbl tr.me td.pt{color:var(--ink)}
.mv{display:inline-block;font-size:10px;margin-inline-start:4px;vertical-align:middle}
.mv.up{color:var(--win)}.mv.down{color:var(--loss)}
.tblNote{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.5}

/* ---------- ticker ---------- */
.ticker{display:grid;grid-template-columns:auto 1fr;align-items:center;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--surface);margin-top:28px;overflow:hidden;height:48px}
.ticker .lab{background:var(--amber);color:var(--amber-ink);font-weight:600;font-size:12px;height:100%;display:flex;align-items:center;padding:0 10px;white-space:nowrap}
.ticker .track{overflow:hidden;height:100%}
.ticker .run{display:flex;gap:28px;align-items:center;height:100%;width:max-content;padding-inline:14px;animation:runRtl var(--dur,30s) linear infinite;animation-play-state:paused}
.ticker.play .run{animation-play-state:running}
@keyframes runRtl{from{transform:translateX(0)}to{transform:translateX(50%)}}
.ticker .it{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;color:var(--muted)}
.ticker .it b{font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.ticker .it.me{color:var(--ink);box-shadow:inset 0 -2px 0 var(--amber)}
.ticker.static .run{animation:none;overflow-x:auto;scroll-snap-type:x proximity}

/* ---------- nav ---------- */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:#0F1B2D;color:#F3F6FB;border-top:2px solid #1E56C8;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:rgba(243,246,251,.6);position:relative;transition:color 160ms}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:#F3F6FB}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;inset-inline:18%;height:4px;background:var(--amber)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(14,16,19,.6);opacity:0;pointer-events:none;transition:opacity 260ms}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;
  max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--bg);color:var(--ink);border-top:4px solid var(--amber);
  padding:12px 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform 420ms var(--ease-drawer);
}
.sheet:not(.on){transition:transform 260ms cubic-bezier(.4,0,1,1)}
.sheet.on{transform:none}
.grab{width:48px;height:4px;background:var(--line-strong);margin:0 auto 14px}
.sheet-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet-h .mark{--s:72px;border-width:3px}
.sheet-h h3{font-family:var(--display);font-weight:700;font-size:36px;line-height:.9;overflow-wrap:anywhere}
.sheet-h .sub{font-size:14px;color:var(--muted);margin-top:4px;font-weight:500}
.sheet .h3{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;margin:20px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.sheet .emptyLine{font-size:15px;color:var(--muted);padding:4px 2px}

/* ---------- states ---------- */
.sk{background:linear-gradient(90deg,var(--surface) 0%,var(--bg) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border:2px solid var(--line)}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{padding:24px 16px;border:2px dashed var(--line-strong);color:var(--muted);font-size:15px;text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-weight:700;font-size:28px;margin-bottom:4px}
.err{margin:16px;padding:14px;border:2px solid var(--loss);color:var(--loss);font-weight:600;font-size:14px}
.updated{font-size:12px;color:var(--muted);text-align:center;margin:26px 16px 0}
.updated a{text-decoration:underline}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}

@media (min-width:900px){
  .app{max-width:720px}
}
@media (prefers-reduced-motion: reduce){
  .view.on,.rise,.chev,.stamp.slam,.scarf.enter,.cd .d.tick{animation:fade 200ms ease both}
  .sheet,.sheet:not(.on){transition:transform 1ms,opacity 200ms ease}
  .sheet:not(.on){opacity:0}
  .ticker .run{animation:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<header class="scarf" id="scarf">
  <div class="a"><span class="name" id="teamTitle">גליל גולן דרום</span></div>
  <div class="b"><span class="cat" id="leagueTitle">ילדים ב'</span>
    <button class="themeBtn press" id="themeBtn" aria-label="מצב יום או לילה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </div>
</header>

<div class="app">
  <main id="main">
    <section class="view on" id="v-home" aria-label="בית">
      <div id="homeBody">
        <div class="sk" style="height:420px"></div>
        <div class="sk pad" style="height:120px;margin:16px"></div>
      </div>
    </section>

    <section class="view pad" id="v-games" aria-label="משחקים">
      <div class="seg" id="gamesSeg" data-i="0"><div class="thumb"></div>
        <button aria-selected="true" data-i="0">המשחקים שלנו</button>
        <button aria-selected="false" data-i="1">כל הליגה</button>
      </div>
      <div id="roundsBar" class="rounds" hidden></div>
      <div id="gamesBody" class="list"></div>
    </section>

    <section class="view pad" id="v-table" aria-label="טבלה">
      <h2 class="h2">טבלת הליגה<small id="tblSub"></small></h2>
      <table class="tbl" id="tbl">
        <thead><tr><th>#</th><th class="l">קבוצה</th><th>מש'</th><th>הפרש</th><th>נק'</th></tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
      <div class="tblNote" id="tblNote"></div>
    </section>

    <section class="view pad" id="v-cal" aria-label="יומן">
      <div style="display:grid;grid-template-columns:1fr 56px;gap:10px;margin:16px 0 6px">
        <button class="btn amber press" id="icsAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>כל העונה ליומן הטלפון</button>
        <button class="btn sq press" id="shareSeason" aria-label="שיתוף הלוח"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8h16v-8M16 6l-4-4-4 4M12 2v13"/></svg></button>
      </div>
      <div id="calBody"></div>
    </section>

    <div class="updated" id="updated"></div>
  </main>
</div>

<nav class="nav" aria-label="ניווט">
  <div class="nav-in">
    <button class="press" data-view="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>בית</button>
    <button class="press" data-view="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4.5 3.3-1.7 5.4H9.2L7.5 10.3z"/><path d="M12 3v4M7.5 10.3L4 9M16.5 10.3L20 9M9.2 15.7L7 19M14.8 15.7L17 19"/></svg>משחקים</button>
    <button class="press" data-view="table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>טבלה</button>
    <button class="press" data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>יומן</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="פרטי קבוצה"><div class="grab"></div><div id="sheetBody"></div></div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const TZ="Asia/Jerusalem";
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
let DATA=null,CFG=null,OVR=null,ME=null,NEXT=null;
const state={view:"home",gamesMode:0,round:null};

/* theme */
const themeKey="gd-theme";
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; }
try{ applyTheme(localStorage.getItem(themeKey)||""); }catch{}
$("#themeBtn").addEventListener("click",()=>{
  const dark=getComputedStyle(document.documentElement).colorScheme.includes("dark");
  const next=dark?"light":"dark"; applyTheme(next); try{localStorage.setItem(themeKey,next);}catch{}
});
try{ if(!sessionStorage.getItem("gd-scarf")){ $("#scarf").classList.add("enter"); sessionStorage.setItem("gd-scarf","1"); } }catch{}

/* helpers */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parts=d=>{ const f=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); const o={}; for(const p of f.formatToParts(d)) o[p.type]=p.value; if(o.hour==="24") o.hour="00"; return o; };
function israelDate(isoDate,h,m){
  const guess=new Date(`${isoDate}T${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:00Z`);
  if(isNaN(guess)) return null;
  const p=parts(guess); const wall=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);
  return new Date(guess.getTime()-(wall-guess.getTime()));
}
const validTime=s=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(s||""); return m && +m[1]<24 && +m[2]<60 ? [+m[1],+m[2]] : null; };
function gameTime(g){
  const d=new Date(g.date); const p=parts(d); const iso=`${p.year}-${p.month}-${p.day}`;
  const ov=OVR?.games?.[g.id]; const t=validTime(ov?.time);
  if(t){ const dt=israelDate(iso,t[0],t[1]); if(dt) return {date:dt,tbd:false,timeStr:`${String(t[0]).padStart(2,"0")}:${String(t[1]).padStart(2,"0")}`,iso}; }
  const tbd=(p.hour==="00"||p.hour==="01")&&p.minute==="00";
  return {date:d,tbd,timeStr:tbd?"":`${p.hour}:${p.minute}`,iso};
}
// the moment a game stops being "next": published time + 3h, or end of match day when no time
function expiresAt(g){ const t=gameTime(g); return t.tbd ? israelDate(t.iso,23,59).getTime() : t.date.getTime()+3*3600000; }
const heDate=(d,o)=>new Intl.DateTimeFormat("he-IL",{timeZone:TZ,...o}).format(d);
const dayNum=d=>heDate(d,{day:"numeric"}), monShort=d=>heDate(d,{month:"short"}), weekday=d=>heDate(d,{weekday:"long"});
const longDate=d=>heDate(d,{weekday:"long",day:"numeric",month:"long"});
function shortName(n){ return n.replace(/^(מ\.כ\.?|מ\.ס\.?|ה\.|מועדון הכדורגל|מרכז קהילתי|איחוד)\s*/,"").replace(/\s*צו פיוס\s*$/,"").trim()||n; }
function initials(n){ const w=shortName(n).replace(/^(הפועל|הפ'|מכבי|בית"ר|ביתר|בני|עירוני)\s+/,"").split(/\s+/).filter(x=>/[א-ת]/.test(x)); return (w[0]?.[0]||"?")+(w[1]?.[0]||""); }
const isMe=t=>t&&(t.id===ME.id||t.name.includes(CFG.team.match));
const mine=g=>isMe(g.home)||isMe(g.away);
const played=g=>g.home.goals!==null&&g.away.goals!==null;
function outcome(g,teamId){ if(!played(g)||!teamId) return null; if(g.home.id!==teamId&&g.away.id!==teamId) return null; const home=g.home.id===teamId; const my=home?g.home.goals:g.away.goals, op=home?g.away.goals:g.home.goals; return my>op?"W":my<op?"L":"D"; }
const outcomeHe={W:"ניצחנו",D:"תיקו",L:"הפסדנו"}, outcomeHe3={W:"ניצחון",D:"תיקו",L:"הפסד"};
const teamGames=id=>DATA.games.filter(g=>g.home.id===id||g.away.id===id).sort((a,b)=>a.date.localeCompare(b.date));
const formOf=(id,n=5)=>teamGames(id).filter(played).slice(-n).map(g=>outcome(g,id));
function computeTable(maxRound=Infinity){
  const t=new Map(); for(const tm of DATA.teams) t.set(tm.id,{id:tm.id,name:tm.name,games:0,wins:0,draws:0,losses:0,gf:0,ga:0,points:0});
  for(const g of DATA.games){ if(!played(g)||g.round>maxRound) continue; const h=t.get(g.home.id),a=t.get(g.away.id); if(!h||!a) continue;
    h.games++;a.games++;h.gf+=g.home.goals;h.ga+=g.away.goals;a.gf+=g.away.goals;a.ga+=g.home.goals;
    if(g.home.goals>g.away.goals){h.wins++;a.losses++;h.points+=3;} else if(g.home.goals<g.away.goals){a.wins++;h.losses++;a.points+=3;} else {h.draws++;a.draws++;h.points++;a.points++;} }
  const arr=[...t.values()].map(x=>({...x,gd:x.gf-x.ga}));
  arr.sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name,"he")); arr.forEach((x,i)=>x.rank=i+1); return arr;
}
const lastPlayedRound=()=>Math.max(0,...DATA.games.filter(played).map(g=>g.round));
const venueOf=(g,home)=>{ const ov=OVR?.games?.[g.id]||{}; return {venue:ov.venue||(home?(OVR?.venues?.home?.name||""):""), waze:ov.waze||(home?(OVR?.venues?.home?.waze||""):""), note:ov.note||(home?(OVR?.venues?.home?.note||""):"")}; };
// score string with each team's goals next to its own side: home is on the right in RTL, so LTR "away:home"
const scoreLtr=g=>`${g.away.goals}<i>:</i>${g.home.goals}`;
const scoreTxt=g=>`${g.away.goals}:${g.home.goals}`;

/* ICS */
function icsEvent(g){
  const t=gameTime(g); const home=isMe(g.home); const opp=home?g.away.name:g.home.name; const v=venueOf(g,home);
  const fmt=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const lines=["BEGIN:VEVENT",`UID:${g.id}@galil-golan-darom`,`DTSTAMP:${fmt(new Date())}`,`SUMMARY:${CFG.team.displayName} נגד ${shortName(opp)} (${home?"בית":"חוץ"})`];
  if(t.tbd){ const n=new Date(t.date.getTime()+86400000),q=parts(n); lines.push(`DTSTART;VALUE=DATE:${t.iso.replace(/-/g,"")}`,`DTEND;VALUE=DATE:${q.year}${q.month}${q.day}`); }
  else lines.push(`DTSTART:${fmt(t.date)}`,`DTEND:${fmt(new Date(t.date.getTime()+90*60000))}`);
  if(v.venue) lines.push(`LOCATION:${v.venue.replace(/,/g,"\\,")}`);
  lines.push(`DESCRIPTION:${[`מחזור ${g.round}`,v.note,t.tbd?"השעה טרם פורסמה":""].filter(Boolean).join("\\n")}`,"END:VEVENT"); return lines.join("\r\n");
}
function downloadIcs(games,name){
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//galil-golan-darom//he","CALSCALE:GREGORIAN",...games.map(icsEvent),"END:VCALENDAR"].join("\r\n");
  const blob=new Blob([body],{type:"text/calendar;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}
function gameText(g){
  const t=gameTime(g); const home=isMe(g.home); const opp=home?g.away.name:g.home.name; const v=venueOf(g,home);
  const lines=[`⚽ ${CFG.team.displayName} נגד ${shortName(opp)}`,`${longDate(t.date)}${t.tbd?" (השעה תפורסם)":" בשעה "+t.timeStr}`,`${home?"משחק בית":"משחק חוץ"} | מחזור ${g.round}`];
  if(v.venue) lines.push(`📍 ${v.venue}`); if(v.waze) lines.push(v.waze); if(v.note) lines.push(v.note);
  lines.push("",location.href.split("#")[0]); return lines.join("\n");
}
async function share(text){ if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==="AbortError") return; } } window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener"); }

/* ---------- home ---------- */
const ICONS={
  share:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8h16v-8M16 6l-4-4-4 4M12 2v13"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>`,
  pin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
};
let cdTimer=null;
function renderHome(){
  const my=teamGames(ME.id); const now=Date.now();
  const next=NEXT; const last=[...my].reverse().find(played);
  const tbl=computeTable(); const meRow=tbl.find(r=>r.id===ME.id); const form=formOf(ME.id);
  let html="";
  if(next){
    const t=gameTime(next); const home=isMe(next.home); const opp=home?next.away:next.home; const v=venueOf(next,home); const oppRow=tbl.find(r=>r.id===opp.id);
    const isToday=parts(new Date()).day===t.iso.slice(8)&&parts(new Date()).month===t.iso.slice(5,7);
    html+=`<div class="hero">
      <div class="hero-top rise" style="--i:0"><span class="eyebrow"><b>המשחק הבא</b> מחזור ${next.round}</span><span class="stamp ${home?"amber":"blue"} slam">${home?"בית":"חוץ"}</span></div>
      <div class="opp rise" style="--i:1"><div class="mark">${esc(initials(opp.name))}</div><div class="who"><div class="pre">${home?"מארחים את":"נוסעים אל"}${oppRow?.games?` · מקום ${oppRow.rank}`:""}</div><div class="name">${esc(shortName(opp.name))}</div></div></div>
      <div class="chalk"></div>
      <div class="details rise" style="--i:2">
        <div><div class="when">${isToday?"היום, ":""}${esc(longDate(t.date))}</div>${v.venue?`<div class="where">${ICONS.pin}<span>${esc(v.venue)}</span></div>`:""}</div>
        <div>${t.tbd?`<span class="stamp">השעה תפורסם</span>`:`<div class="time">${esc(t.timeStr)}</div>`}</div>
      </div>
      <div class="cd rise" id="cd" style="--i:3"></div>
      ${v.note?`<div class="note rise" style="--i:4">${esc(v.note)}</div>`:""}
      <div class="tear"></div>
    </div>
    <div class="actions rise" style="--i:4">
      <button class="btn amber press" data-act="share" data-id="${next.id}">${ICONS.share}שתפו בוואטסאפ</button>
      <button class="btn sq press" data-act="ics" data-id="${next.id}" aria-label="הוספה ליומן">${ICONS.cal}</button>
      ${v.waze?`<a class="btn sq blue press" href="${esc(v.waze)}" target="_blank" rel="noopener" aria-label="ניווט">${ICONS.pin}</a>`:`<button class="btn sq press" data-act="opp" data-id="${opp.id}" aria-label="על היריבה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>`}
    </div>`;
  } else {
    html+=`<div class="pad" style="padding-top:20px"><div class="empty"><b>אין משחק קרוב</b>העונה הסתיימה או שהלוח טרם פורסם.</div></div>`;
  }
  if(last){
    const o=outcome(last,ME.id);
    html+=`<div class="pad"><h2 class="h2 rise" style="--i:5">התוצאה האחרונה<small>${esc(heDate(gameTime(last).date,{day:"numeric",month:"long"}))} · ${isMe(last.home)?"בית":"חוץ"}</small></h2>
      <div class="led rise" style="--i:5" data-act="game" data-id="${last.id}">
        <div class="stampWrap"><span class="stamp ${o} slam">${outcomeHe[o]}</span></div>
        <div class="row"><div class="t ${isMe(last.home)?"me":""}">${esc(isMe(last.home)?CFG.team.displayName:shortName(last.home.name))}</div><div class="sc ${o}">${scoreLtr(last)}</div><div class="t ${isMe(last.away)?"me":""}">${esc(isMe(last.away)?CFG.team.displayName:shortName(last.away.name))}</div></div>
        <div class="meta">מחזור ${last.round} · לחיצה לפרטי היריבה</div>
      </div></div>`;
    maybeConfetti(last,o);
  }
  html+=`<div class="pad"><h2 class="h2 rise" style="--i:6">העונה שלנו<small>${esc(DATA.league.name)}</small></h2>
    <div class="tiles rise" style="--i:6">
      <div class="tile"><b>${meRow?.games?meRow.rank:"-"}</b><span>מקום</span></div>
      <div class="tile"><b>${meRow?.points??0}</b><span>נקודות</span></div>
      <div class="tile"><b>${meRow?.games??0}</b><span>משחקים</span></div>
      <div class="tile"><b class="ltr">${meRow?`${meRow.gf}:${meRow.ga}`:"0:0"}</b><span>שערים</span></div>
    </div>
    <div class="formRow rise" style="--i:7"><span>5 משחקים אחרונים</span>${formStrip(form)}</div></div>`;
  const upcoming=my.filter(g=>!played(g)&&g!==next).slice(0,3);
  if(upcoming.length) html+=`<div class="pad"><h2 class="h2 rise" style="--i:8">בהמשך</h2><div class="list">${upcoming.map((g,i)=>ticket(g,i+8)).join("")}</div></div>`;
  html+=tickerHtml();
  $("#homeBody").innerHTML=html;
  startCountdown(next); armTicker();
}
function formStrip(form,sm=false){
  const cells=[...form]; while(cells.length<5) cells.unshift("E");
  return `<span class="form ${sm?"sm":""}">${cells.map((o,i)=>`<span class="chev ${o}" style="--i:${i}">${o==="E"?"":o==="W"?"נ":o==="D"?"ת":"ה"}</span>`).join("")}</span>`;
}
function startCountdown(next){
  clearInterval(cdTimer); const el=$("#cd"); if(!el||!next) return;
  const t=gameTime(next); const target=t.tbd?israelDate(t.iso,9,0):t.date; let mode="";
  const two=n=>String(Math.max(0,n)).padStart(2,"0");
  const cell=(k,lab)=>`<div class="cell"><div class="digits"><span class="d" data-k="${k}0"></span><span class="d" data-k="${k}1"></span></div><div class="lab">${lab}</div></div>`;
  const tick=()=>{
    const diff=Math.max(0,target.getTime()-Date.now());
    const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
    let nm,vals;
    if(t.tbd){ nm="days"; vals={a:two(Math.max(1,Math.ceil((israelDate(t.iso,0,0).getTime()-Date.now())/86400000)))}; }
    else if(diff===0){ nm="now"; }
    else if(d>0){ nm="dhm"; vals={a:two(d),b:two(h),c:two(m)}; }
    else if(h>0){ nm="hms"; vals={a:two(h),b:two(m),c:two(s)}; }
    else { nm="min"; vals={a:two(m),b:two(s)}; }
    if(nm!==mode){ mode=nm; el.className="cd rise"; el.style.setProperty("--i",3);
      if(nm==="now"){ el.innerHTML=`<div class="today" style="grid-column:1/-1">המשחק מתחיל</div>`; clearInterval(cdTimer); return; }
      if(nm==="days"){ el.classList.add("single"); el.innerHTML=cell("a","ימים למשחק"); }
      else if(nm==="dhm") el.innerHTML=cell("a","ימים")+cell("b","שעות")+cell("c","דקות");
      else if(nm==="hms") el.innerHTML=`<div class="today" style="grid-column:1/-1">היום</div>`+cell("a","שעות")+cell("b","דקות")+cell("c","שניות");
      else el.innerHTML=`<div class="today" style="grid-column:1/-1">בעוד ${m} דק'</div>`+cell("a","דקות")+cell("b","שניות");
    }
    if(nm==="min"){ const tdy=el.querySelector(".today"); if(tdy) tdy.textContent=`בעוד ${m} דק'`; }
    for(const k in vals){ const v=vals[k]; [0,1].forEach(i=>{ const b=el.querySelector(`[data-k="${k}${i}"]`); if(b&&b.textContent!==v[i]){ b.textContent=v[i]; if(!REDUCED){ b.classList.remove("tick"); void b.offsetWidth; b.classList.add("tick"); } } }); }
  };
  tick(); cdTimer=setInterval(tick,1000);
}
function tickerHtml(){
  const lr=lastPlayedRound(); if(!lr) return "";
  const gs=DATA.games.filter(g=>g.round===lr&&played(g));
  if(!gs.length) return "";
  const items=gs.map(g=>`<span class="it ${mine(g)?"me":""}"><span>${esc(shortName(g.home.name))}</span><b>${scoreLtr(g)}</b><span>${esc(shortName(g.away.name))}</span></span>`).join("");
  return `<div class="ticker ${REDUCED?"static":""}" id="ticker" style="--dur:${Math.max(18,gs.length*5)}s"><div class="lab">מחזור ${lr}</div><div class="track"><div class="run">${items}${REDUCED?"":items}</div></div></div>`;
}
let tickerIO=null;
function armTicker(){ const t=$("#ticker"); if(tickerIO) tickerIO.disconnect(); if(!t||REDUCED) return; tickerIO=new IntersectionObserver(es=>es.forEach(e=>t.classList.toggle("play",e.isIntersecting)),{threshold:.2}); tickerIO.observe(t); }

/* ---------- tickets ---------- */
function ticket(g,i=0,focus=ME.id){
  const t=gameTime(g); const isMine=mine(g); const me=isMine?(isMe(g.home)?"home":"away"):null;
  const o=played(g)?outcome(g,focus):null;
  const v=venueOf(g,me==="home");
  const stub=played(g)?`<span class="sc ${o||""}">${scoreLtr(g)}</span><span class="r">מחזור ${g.round}</span>`
    : t.tbd?`<span class="tbd">השעה<br>תפורסם</span><span class="r">מחזור ${g.round}</span>`:`<span class="tm">${esc(t.timeStr)}</span><span class="r">מחזור ${g.round}</span>`;
  return `<button class="tk rise press ${g===NEXT?"next":""}" style="--i:${i}" data-act="game" data-id="${g.id}">
    <div class="dt"><b>${esc(dayNum(t.date))}</b><span>${esc(monShort(t.date))}<br>${esc(weekday(t.date)).replace("יום ","")}</span></div>
    <div class="mid"><div class="n ${isMe(g.home)?"me":""}">${esc(isMe(g.home)?CFG.team.displayName:shortName(g.home.name))}</div><div class="n ${isMe(g.away)?"me":""}">${esc(isMe(g.away)?CFG.team.displayName:shortName(g.away.name))}</div>
      ${isMine?`<div class="m"><span class="tag ${me==="home"?"":"blue"}">${me==="home"?"בית":"חוץ"}</span>${v.venue?`<span>${esc(v.venue)}</span>`:""}</div>`:""}</div>
    <div class="stub">${stub}</div></button>`;
}
function renderGames(){
  const body=$("#gamesBody"),bar=$("#roundsBar");
  if(state.gamesMode===0){ bar.hidden=true; const my=teamGames(ME.id); body.innerHTML=my.length?my.map((g,i)=>ticket(g,Math.min(i,8))).join(""):`<div class="empty"><b>אין משחקים</b>הלוח טרם פורסם.</div>`;
    const nx=body.querySelector(".tk.next"); if(nx&&!REDUCED) setTimeout(()=>nx.scrollIntoView({block:"center",behavior:"smooth"}),300); }
  else { bar.hidden=false; const rounds=[...new Set(DATA.games.map(g=>g.round))].sort((a,b)=>a-b);
    if(state.round===null) state.round=NEXT?NEXT.round:(lastPlayedRound()||rounds[0]);
    bar.innerHTML=rounds.map(r=>`<button class="press" aria-selected="${r===state.round}" data-round="${r}">מחזור ${r}</button>`).join("");
    const sel=bar.querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({inline:"center",block:"nearest",behavior:REDUCED?"auto":"smooth"});
    body.innerHTML=DATA.games.filter(g=>g.round===state.round).sort((a,b)=>a.date.localeCompare(b.date)).map((g,i)=>ticket(g,i,null)).join(""); }
}

/* ---------- table ---------- */
function renderTable(){
  const now=computeTable(); const lr=lastPlayedRound(); const before=lr>=2?computeTable(lr-1):null;
  $("#tblBody").innerHTML=now.map((r,i)=>{ const pr=before?before.find(x=>x.id===r.id):null; const moved=pr&&pr.games!==r.games;
    const mv=moved&&pr.rank>r.rank?`<span class="mv up">▲</span>`:moved&&pr.rank<r.rank?`<span class="mv down">▼</span>`:"";
    const me=r.id===ME.id;
    return `<tr class="rise ${me?"me":""}" style="--i:${i}" data-act="opp" data-id="${r.id}"><td class="rk">${r.rank}</td><td class="l"><span class="mark ${me?"me":""}">${esc(initials(r.name))}</span>${esc(me?CFG.team.displayName:shortName(r.name))}${mv}</td><td>${r.games}</td><td class="gd ltr">${r.gd>0?"+":""}${r.gd}</td><td class="pt">${r.points}</td></tr>`; }).join("");
  const meRow=now.find(r=>r.id===ME.id);
  $("#tblSub").textContent=meRow&&meRow.games?`מקום ${meRow.rank} מתוך ${now.length}`:`${now.length} קבוצות`;
  $("#tblNote").textContent=(before?`החצים מראים שינוי מקום לעומת סוף מחזור ${lr-1}. `:"")+"לחיצה על קבוצה פותחת את הכרטיס שלה.";
}

/* ---------- calendar ---------- */
function renderCal(){
  const my=teamGames(ME.id); if(!my.length){ $("#calBody").innerHTML=`<div class="empty"><b>אין משחקים</b></div>`; return; }
  const first=gameTime(my[0]).date, lastD=gameTime(my[my.length-1]).date;
  const months=[]; let cur=new Date(Date.UTC(+parts(first).year,+parts(first).month-1,1));
  const end=new Date(Date.UTC(+parts(lastD).year,+parts(lastD).month-1,1));
  while(cur<=end){ months.push(new Date(cur)); cur=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,1)); }
  let html="",i=0;
  for(const m of months){ const key=`${m.getUTCFullYear()}-${String(m.getUTCMonth()+1).padStart(2,"0")}`;
    const gs=my.filter(g=>gameTime(g).iso.startsWith(key));
    html+=`<div class="month">${esc(new Intl.DateTimeFormat("he-IL",{timeZone:"UTC",month:"long"}).format(m))}<small>${m.getUTCFullYear()}</small></div>`;
    html+=gs.length?`<div class="list">${gs.map(g=>ticket(g,Math.min(i++,8))).join("")}</div>`:`<div class="emptyMonth">אין משחקים בחודש הזה</div>`; }
  $("#calBody").innerHTML=html;
}

/* ---------- sheet ---------- */
function openSheet(html){ const s=$("#sheet"); $("#sheetBody").innerHTML=html; s.scrollTop=0; s.classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").addEventListener("click",closeSheet);
function teamSheet(id){
  const tm=DATA.teams.find(t=>t.id===id); if(!tm) return;
  const row=computeTable().find(r=>r.id===id); const gs=teamGames(id); const done=gs.filter(played); const recent=done.slice(-5).reverse(); const form=formOf(id);
  const me=id===ME.id; const h2h=gs.filter(mine); const h2hDone=h2h.filter(played); const nextVs=h2h.find(g=>!played(g));
  const avg=(n,d)=>d?(n/d).toFixed(1):"0.0";
  let html=`<div class="sheet-h"><div class="mark ${me?"me":""}">${esc(initials(tm.name))}</div><div><h3>${esc(me?CFG.team.displayName:tm.name)}</h3><div class="sub">${row?.games?`מקום ${row.rank} · ${row.points} נק' · ${row.games} משחקים`:"עוד לא שיחקו העונה"}</div></div></div>
    <div class="tiles"><div class="tile"><b>${row?.wins??0}</b><span>ניצחונות</span></div><div class="tile"><b>${row?.draws??0}</b><span>תיקו</span></div><div class="tile"><b>${row?.losses??0}</b><span>הפסדים</span></div><div class="tile"><b>${avg(row?.gf,row?.games)}</b><span>שערים למשחק</span></div></div>
    <div class="formRow"><span>כושר אחרון</span>${formStrip(form)}</div>`;
  if(!me){ html+=`<div class="h3">מול ${esc(CFG.team.displayName)}</div>`;
    if(h2hDone.length) html+=`<div class="list">${h2hDone.slice().reverse().map((g,i)=>ticket(g,i)).join("")}</div>`;
    else if(nextVs){ const t=gameTime(nextVs); html+=`<div class="emptyLine">עוד לא נפגשנו העונה. המפגש הראשון: ${esc(longDate(t.date))}${isMe(nextVs.home)?" אצלנו":" אצלם"}.</div>`; } }
  html+=`<div class="h3">המשחקים האחרונים ${me?"שלנו":"שלהם"}</div>`+(recent.length?`<div class="list">${recent.map((g,i)=>ticket(g,i,id)).join("")}</div>`:`<div class="emptyLine">עוד לא שוחקו משחקים העונה.</div>`);
  const up=gs.filter(g=>!played(g)).slice(0,3); if(up.length) html+=`<div class="h3">המשחקים הבאים ${me?"שלנו":"שלהם"}</div><div class="list">${up.map((g,i)=>ticket(g,i,id)).join("")}</div>`;
  openSheet(html);
}
function gameSheet(id){
  const g=DATA.games.find(x=>x.id===id); if(!g) return;
  if(mine(g)) return teamSheet(isMe(g.home)?g.away.id:g.home.id);
  const t=gameTime(g);
  openSheet(`<div class="sheet-h"><div><h3>${esc(shortName(g.home.name))} נגד ${esc(shortName(g.away.name))}</h3><div class="sub">${esc(longDate(t.date))}${t.tbd?"":" · "+t.timeStr} · מחזור ${g.round}</div></div></div>
    ${played(g)?`<div class="led"><div class="row"><div class="t">${esc(shortName(g.home.name))}</div><div class="sc">${scoreLtr(g)}</div><div class="t">${esc(shortName(g.away.name))}</div></div></div>`:""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><button class="btn press" data-act="opp" data-id="${g.home.id}">${esc(shortName(g.home.name))}</button><button class="btn press" data-act="opp" data-id="${g.away.id}">${esc(shortName(g.away.name))}</button></div>`);
}

/* ---------- confetti ---------- */
function maybeConfetti(g,o){
  if(o!=="W"||REDUCED) return; const key="gd-confetti-"+g.id; try{ if(localStorage.getItem(key)) return; localStorage.setItem(key,"1"); }catch{ return; }
  const c=$("#confetti"); c.hidden=false; const ctx=c.getContext("2d"); const dpr=Math.min(2,devicePixelRatio||1); c.width=innerWidth*dpr; c.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols=[getComputedStyle(document.documentElement).getPropertyValue("--amber").trim(),"#FAFBFE","#1E56C8","#5B9BFF"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[Math.random()*cols.length|0],a:Math.random()*Math.PI,va:(Math.random()-.5)*.3}));
  const t0=performance.now(); const loop=t=>{ const el=(t-t0)/1000; ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of ps){ p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-el/2.6);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore(); }
    if(el<2.8) requestAnimationFrame(loop); else c.hidden=true; }; requestAnimationFrame(loop);
}

/* ---------- navigation ---------- */
function showView(v){
  state.view=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll(".nav button").forEach(b=>{ if(b.dataset.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(DATA){ if(v==="games") renderGames(); if(v==="table") renderTable(); if(v==="cal") renderCal(); }
  window.scrollTo({top:0,behavior:"instant"}); try{ history.replaceState(null,"","#"+v); }catch{}
}
document.addEventListener("click",e=>{
  const nv=e.target.closest("[data-view]"); if(nv){ showView(nv.dataset.view); return; }
  const rb=e.target.closest("[data-round]"); if(rb){ state.round=Number(rb.dataset.round); renderGames(); return; }
  const sg=e.target.closest("#gamesSeg button"); if(sg){ state.gamesMode=Number(sg.dataset.i); $("#gamesSeg").dataset.i=state.gamesMode; $("#gamesSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b===sg)); renderGames(); return; }
  const a=e.target.closest("[data-act]"); if(!a||!DATA) return; const id=a.dataset.id,act=a.dataset.act;
  if(act==="share") share(gameText(DATA.games.find(g=>g.id===id)));
  else if(act==="ics") downloadIcs([DATA.games.find(g=>g.id===id)],"game.ics");
  else if(act==="opp") teamSheet(id);
  else if(act==="game") gameSheet(id);
});
$("#icsAll").addEventListener("click",()=>{ if(DATA) downloadIcs(teamGames(ME.id).filter(g=>!played(g)),"galil-golan-darom.ics"); });
$("#shareSeason").addEventListener("click",()=>{ if(!DATA) return;
  const lines=[`⚽ לוח המשחקים של ${CFG.team.displayName}`,""];
  for(const g of teamGames(ME.id).filter(g=>!played(g))){ const t=gameTime(g); const home=isMe(g.home); lines.push(`${heDate(t.date,{day:"2-digit",month:"2-digit"})} ${t.tbd?"":t.timeStr+" "}${home?"🏠":"🚌"} ${shortName(home?g.away.name:g.home.name)}`); }
  lines.push("",location.href.split("#")[0]); share(lines.join("\n")); });
let sy=null; const sheet=$("#sheet");
sheet.addEventListener("touchstart",e=>{ sy=sheet.scrollTop===0?e.touches[0].clientY:null; },{passive:true});
sheet.addEventListener("touchmove",e=>{ if(sy!==null&&e.touches[0].clientY-sy>70){ sy=null; closeSheet(); } },{passive:true});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

/* ---------- boot ---------- */
function relTime(iso){ const m=Math.round((Date.now()-new Date(iso).getTime())/60000); if(m<1) return "ממש עכשיו"; if(m<60) return `לפני ${m} דק'`; const h=Math.round(m/60); if(h<48) return `לפני ${h} שעות`; return `לפני ${Math.round(h/24)} ימים`; }
async function boot(){
  try{
    const bust="?v="+Date.now();
    const [d,c,o]=await Promise.all([
      fetch("data.json"+bust,{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("data.json "+r.status); return r.json(); }),
      fetch("config.json"+bust,{cache:"no-store"}).then(r=>r.json()),
      fetch("overrides.json"+bust,{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({})),
    ]);
    DATA=d; CFG=c; OVR=o||{};
    ME=DATA.teams.find(x=>x.name.includes(CFG.team.match)); if(!ME) throw new Error("הקבוצה לא נמצאה בליגה: "+CFG.team.match);
    $("#teamTitle").textContent=CFG.team.displayName; document.title=CFG.site?.title||document.title;
    NEXT=teamGames(ME.id).find(g=>!played(g)&&expiresAt(g)>Date.now())||null;
    renderHome();
    $("#updated").innerHTML=`הנתונים מאתר ONE, עודכנו ${esc(relTime(DATA.fetchedAt))} · <a href="https://vole.one.co.il/league/${DATA.league.id}" target="_blank" rel="noopener">לעמוד הליגה</a>`;
    const h=(location.hash||"#home").slice(1); if(["games","table","cal"].includes(h)) showView(h);
  }catch(e){ $("#homeBody").innerHTML=`<div class="err">לא הצלחנו לטעון את הנתונים. ${esc(e.message)}<br><small>אם פתחת את הקובץ ישירות מהמחשב, צריך שרת מקומי או את כתובת האתר.</small></div>`; }
}
boot();
})();
