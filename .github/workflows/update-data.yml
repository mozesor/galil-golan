name: Update data.json

on:
  workflow_dispatch:
  push:
    paths:
      - overrides.json
      - config.json
  schedule:
    # off the top of the hour, when GitHub queues are least busy
    - cron: "7,37 * * * *"
    # match days (Fri/Sat/Sun, 10:00 to 22:00 Israel): every 15 minutes, as a fallback to the Home Assistant trigger
    - cron: "22,52 7-19 * * 0,5,6"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch from ONE
        working-directory: scripts
        run: node fetch-data.js
      - name: Push notifications
        working-directory: scripts
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: node notify.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json season.ics ics
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "עדכון תוצאות"
          # another run may have pushed meanwhile: replay our commit on top of it, our freshly generated files win
          for i in 1 2 3; do
            git pull --rebase -X theirs origin ${GITHUB_REF_NAME} && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
